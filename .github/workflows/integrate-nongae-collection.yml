name: Integrate Nongae collection characters
on:
  push:
    paths:
      - '.github/workflows/integrate-nongae-collection.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Add Nongae collection unlock and jade-ring shots
        shell: bash
        run: |
          set -euo pipefail
          echo '논개... (truncated)' | base64 -d > /tmp/nongae_patch.py
          python3 /tmp/nongae_patch.py
          git diff --check
          git config user.name 'PWDJ Nongae Integration'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add -A
          git commit -m 'Unlock Nongae characters after RPG ending'
          git push

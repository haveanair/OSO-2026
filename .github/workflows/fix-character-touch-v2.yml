name: Fix character touch freeze v2
on:
  push:
    paths:
      - '.github/workflows/fix-character-touch-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply touch freeze fix and cache bust
        run: python3 .github/fix_character_touch_v2.py
      - name: Verify character bonus module
        shell: bash
        run: |
          set -euo pipefail
          node --check play/character-performance-bonus.js
          ! grep -q 'MutationObserver' play/character-performance-bonus.js
          grep -q 'character-performance-bonus.js?v=20260906-charbonus2' play/index.html
          git diff --check
          bad="$(git diff --name-only | grep -Ev '^(play/character-performance-bonus.js|play/index.html)$' || true)"
          test -z "$bad"
      - name: Publish fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PWDJ Touch Fix'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/character-performance-bonus.js play/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Remove character bonus observer and bust cache'
          git push

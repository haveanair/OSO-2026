name: Fix character aspect and jade FX once

'on':
  push:
    paths:
      - '.github/workflows/fix-character-aspect-jade-fx.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/fix_character_aspect_and_jade_fx.py
      - name: Check aspect module syntax
        run: node --check play/character-aspect-guard.js
      - name: Check jade module syntax
        run: node --check play/nongae-heaven-jade-fx.js
      - name: Check source diff
        run: git diff --check
      - name: Configure git
        run: |
          git config user.name "PWDJ Character Render"
          git config user.email "34460283+haveanair@users.noreply.github.com"
      - name: Commit verified patch
        run: |
          git add play/index.html .github/character-aspect-jade-fx-report.txt
          git diff --cached --check
          git commit -m "Preserve character proportions and enlarge Nongae jade FX"
          git push

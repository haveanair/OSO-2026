name: Validate live visit counter

on:
  push:
    branches: [qa-wrap-audit]
    paths:
      - '.github/validate-wrap-fixes.trigger'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Install browser driver
        run: python3 -m pip install --quiet playwright
      - name: Open live play page and verify counter request
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || true)"
          test -n "$CHROME"
          export CHROME
          cat > /tmp/validate.py <<'PY'
          import os,time
          from playwright.sync_api import sync_playwright
          target='https://haveanair.github.io/OSO-2026/play/'
          endpoint='https://kfxagkjaczfwxebfvfav.supabase.co/functions/v1/record-oso-visit'
          with sync_playwright() as p:
              browser=p.chromium.launch(headless=True,executable_path=os.environ['CHROME'],args=['--no-sandbox','--disable-dev-shm-usage'])
              page=browser.new_page(viewport={'width':390,'height':844})
              seen=[]
              page.on('response', lambda r: seen.append((r.url,r.status)) if endpoint in r.url else None)
              page.goto(target,wait_until='domcontentloaded',timeout=60000)
              page.wait_for_timeout(6000)
              print('counter responses:',seen)
              if not any(url==endpoint and status==200 for url,status in seen):
                  raise SystemExit('visit counter did not return HTTP 200')
              browser.close()
          PY
          python3 /tmp/validate.py

name: Apply stack difficulty fix

on:
  push:
    branches: [qa-wrap-audit]
    paths:
      - '.github/validate-wrap-fixes.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch stack game only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('play/index.html')
          s=p.read_text(encoding='utf-8')
          reps=[
          ('''  <div class="levelHud" id="levelHud">LEVEL 1</div>
  
  <div class="gameTip">비단 폭이 점점 좁아지고 속도가 빨라집니다 · 15단 완성 목표</div>`;''', '''  <div class="levelHud" id="levelHud">LEVEL 1</div>
  <div class="lifeHud" id="stackLife">❤️❤️❤️</div>
  
  <div class="gameTip">폭 유지가 핵심 · MISS 시 ❤️ -1 · 15단 완성</div>`;'''),
          ('''  let score=0,floor=0,alive=true,raf,last=0,current=null,x=0,dir=1,perfect=0,accuracyTotal=0,level=1,lastDropAt=-1e9,retrying=false;''', '''  let score=0,floor=0,alive=true,raf,last=0,current=null,x=0,dir=1,perfect=0,accuracyTotal=0,level=1,lastDropAt=-1e9,retrying=false,lives=3;'''),
          ('''  function hud(){
   $('#gScore').textContent=score;
   $('#floorHud').textContent=`${floor} / 15 단`;
   const acc=floor?Math.round(accuracyTotal/floor):0;
   $('#perfectHud').textContent=`정확도 ${acc}%`;
  }''', '''  function hud(){
   $('#gScore').textContent=score;
   $('#floorHud').textContent=`${floor} / 15 단`;
   const acc=floor?Math.round(accuracyTotal/floor):0;
   $('#perfectHud').textContent=`정확도 ${acc}%`;
   $('#stackLife').textContent='❤️'.repeat(lives)+'🖤'.repeat(Math.max(0,3-lives));
  }'''),
          ('''   let w=Math.max(90,baseW-floor*12);
   e.style.width=w+'px';''', '''   const placed=lane.querySelectorAll('.silkPiece,.silkBase');
   const prevPlaced=placed[placed.length-1];
   let w=prevPlaced?parseFloat(prevPlaced.style.width):baseW;
   if(!Number.isFinite(w)||w<=0)w=baseW;
   e.style.width=w+'px';'''),
          ('''   if(overlap<28){
    retrying=true;
    const failed=current;
    failed.classList.add('miss');
    score=Math.max(0,score-30);$('#gScore').textContent=score;
    tone('bad');buzz(110);softShake();showComboBurst('MISS! 다시!',2,'multi');
    setTimeout(()=>{
     if(!alive)return;
     failed.remove();
     dir*=-1;
     current=piece();
     x=dir>0?0:Math.max(0,W()-parseFloat(current.style.width));
     current.style.left=x+'px';
     lastDropAt=performance.now();
     retrying=false
    },360);
    return;
   }''', '''   if(overlap<28){
    retrying=true;
    const failed=current;
    failed.classList.add('miss');
    lives=Math.max(0,lives-1);
    score=Math.max(0,score-60);hud();
    tone('bad');buzz(110);softShake();
    if(lives<=0){
     alive=false;
     cancelAnimationFrame(raf);
     showComboBurst('GAME OVER',3,'multi');
     setTimeout(()=>finish('stack',score,playStack,false),560);
     return;
    }
    showComboBurst(`MISS! ❤️ ${lives}/3`,2,'multi');
    setTimeout(()=>{
     if(!alive)return;
     failed.remove();
     dir*=-1;
     current=piece();
     x=dir>0?0:Math.max(0,W()-parseFloat(current.style.width));
     current.style.left=x+'px';
     lastDropAt=performance.now();
     retrying=false
    },360);
    return;
   }'''),
          ('''   let centered=Math.abs((l+w/2)-(pl+pw/2));
   let q=overlap/pw;
   let placementAcc=stackClamp(100-(centered/Math.max(1,pw*.5))*100,0,100);
   let bonus=Math.max(0,Math.round(100-centered));
   score += Math.round(130*q)+bonus;
   accuracyTotal+=placementAcc;''', '''   let centered=Math.abs((l+w/2)-(pl+pw/2));
   let placementAcc=stackClamp(100-(centered/Math.max(1,pw*.5))*100,0,100);
   let pts=placementAcc>=97?360:placementAcc>=88?220:placementAcc>=75?110:40;
   score += pts;
   accuracyTotal+=placementAcc;'''),
          ('''    showComboBurst('PERFECT!',10,'great');particles(innerWidth*.5,innerHeight*.38,'✨',12)''', '''    showComboBurst(`PERFECT! +${pts}`,10,'great');particles(innerWidth*.5,innerHeight*.38,'✨',12)'''),
          ('''    current.classList.add('good');tone('perfect');buzz([32,12,48]);showComboBurst('GREAT!',5,'great')''', '''    current.classList.add('good');tone('perfect');buzz([32,12,48]);showComboBurst(`GREAT! +${pts}`,5,'great')'''),
          ('''    current.classList.add('ok');tone('good');buzz(32);showComboBurst('GOOD!',2,'combo')''', '''    current.classList.add('ok');tone('good');buzz(32);showComboBurst(`GOOD! +${pts}`,2,'combo')'''),
          ('''    current.classList.add('ok');tone('good');buzz(32);showComboBurst('아슬아슬!',2,'combo')''', '''    current.classList.add('ok');tone('good');buzz(32);showComboBurst(`아슬아슬! +${pts}`,2,'combo')''')
          ]
          for i,(old,new) in enumerate(reps,1):
              n=s.count(old)
              if n!=1:
                  raise SystemExit(f'replacement {i} expected once, found {n}')
              s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git diff -- play/index.html
      - name: Commit production change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PWDJ'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/index.html
          git commit -m 'Make silk stacking width persistent and add lives'
          git push origin HEAD:main

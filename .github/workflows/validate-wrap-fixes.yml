name: Apply stack difficulty fix

on:
  push:
    branches: [qa-wrap-audit]
    paths:
      - '.github/validate-wrap-fixes.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply strict stack-only patch
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/haveanair/OSO-2026/qa-wrap-audit/.github/stack_patch.py' -o /tmp/stack_patch.py
          python3 /tmp/stack_patch.py play/index.html
          git diff --check
          git diff -- play/index.html
      - name: Commit production change
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PWDJ'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/index.html
          git commit -m 'Make silk stacking width persistent and add lives'
          git push origin HEAD:main

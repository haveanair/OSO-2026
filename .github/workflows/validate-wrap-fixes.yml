name: Inspect stack game logic

on:
  push:
    branches: [qa-wrap-audit]
    paths:
      - '.github/validate-wrap-fixes.trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect current production stack source
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL 'https://raw.githubusercontent.com/haveanair/OSO-2026/main/play/index.html' -o /tmp/play.html
          python3 - <<'PY'
          from pathlib import Path
          s=Path('/tmp/play.html').read_text(encoding='utf-8')
          needles=['function playStack','playStack(){','stackBlock','stackGuide','비단쌓기','stackScore','MISS']
          for needle in needles:
              print('\n===== ',needle,' =====')
              start=0; n=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  n+=1
                  a=max(0,i-1800); b=min(len(s),i+7000)
                  print(f'--- occurrence {n} at {i} ---')
                  print(s[a:b].replace('><','>\n<'))
                  start=i+len(needle)
                  if n>=5: break
              if n==0: print('NOT FOUND')
          PY

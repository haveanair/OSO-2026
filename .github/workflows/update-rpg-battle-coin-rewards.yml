name: Update RPG battle coin rewards
on:
  push:
    paths:
      - '.github/workflows/update-rpg-battle-coin-rewards.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic RPG battle rewards
        run: python3 .github/rpg_battle_coin_rewards.py
      - name: Verify and publish
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'PWDJ RPG Reward Update'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/index.html .github/rpg-battle-coin-reward-report.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Increase RPG battle coin rewards'
          git push

name: Inspect RPG field actions
on:
  push:
    paths:
      - '.github/workflows/inspect-rpg-field-actions.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect RPG menu and field actions
        run: python3 .github/rpg_field_action_inspect.py
      - name: Publish report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'PWDJ RPG Field Inspect'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add .github/rpg-field-action-inspect.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Record expanded RPG field action structure'
          git push
# one-shot inspection v2

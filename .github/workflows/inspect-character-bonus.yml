name: Inspect character bonus economy
on:
  push:
    paths:
      - '.github/workflows/inspect-character-bonus.yml'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Inspect character and reward structure
        run: python3 .github/inspect_character_bonus.py
      - name: Publish inspection report
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'PWDJ Character Bonus Inspect'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add .github/character-bonus-inspection.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Record exact character bonus structure'
          git push
# exact inspection rerun

name: Fix location labels

on:
  push:
    branches: [main]
    paths:
      - '.github/location-label-fix.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace location labels in frozen web game
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path('play/index.html')
          s = p.read_text(encoding='utf-8')
          before_mid = s.count('중간통로')
          before_main = s.count('대통로')
          if before_mid != 4 or before_main != 4:
              raise SystemExit(f'unexpected counts: 중간통로={before_mid}, 대통로={before_main}')
          s = s.replace('중간통로', '2구통로').replace('대통로', '1구통로')
          p.write_text(s, encoding='utf-8')
          check = p.read_text(encoding='utf-8')
          if '중간통로' in check or '대통로' in check:
              raise SystemExit('old labels remain')
          if check.count('2구통로') != 4 or check.count('1구통로') != 4:
              raise SystemExit(f'new counts wrong: 2구통로={check.count("2구통로")}, 1구통로={check.count("1구통로")}')
          print('verified: 2구통로=4, 1구통로=4')
          PY
          git config user.name 'PWDJ Web Fix'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/index.html
          git commit -m 'Fix market passage labels in web game'
          git push

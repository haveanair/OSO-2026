name: Fix silk judgement visibility

on:
  push:
    paths:
      - '.github/workflows/fix-silk-judge-visible.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply silk judgement visibility fix
        run: python .github/scripts/fix-silk-judge-visible.py
      - name: Validate character bonus javascript
        run: node --check play/character-performance-bonus.js
      - name: Verify visible animation rules and cache-buster
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('play/character-performance-bonus.js').read_text(encoding='utf-8')
          h=Path('play/index.html').read_text(encoding='utf-8')
          assert '#stage .sseJudgeBurst2' in s
          assert 'opacity:0!important;animation:sseJudgeBurst2' not in s
          assert 'transform:translateX(-50%) scale(.72)!important' not in s[s.index('#stage .sseJudgeBurst2'):s.index('@keyframes sseJudgeBurst2')]
          assert 'will-change:transform,opacity' in s
          assert 'character-performance-bonus.js?v=20260908-judgefx1' in h
          print('judgement animation visibility markers verified')
          PY
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/character-performance-bonus.js play/index.html
          git diff --cached --quiet && exit 0
          git commit -m "비단 판정 이펙트 표시 복구"
          git push

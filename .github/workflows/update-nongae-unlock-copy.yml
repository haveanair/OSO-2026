name: Update Nongae unlock copy
on:
  push:
    paths:
      - '.github/workflows/update-nongae-unlock-copy.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update Nongae unlock wording
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/scripts/update_nongae_unlock_copy.py
          git diff --check
          git config user.name 'PWDJ Nongae Copy Fix'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/index.html .github/nongae-unlock-copy-report.txt
          git commit -m 'Clarify Nongae unlock condition wording'
          git push

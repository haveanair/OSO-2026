name: Fix Spacefighter KF21 Topdown

on:
  push:
    branches: [main]
    paths:
      - '.github/spacefighter-kf21-topdown-fix.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace wrong KF21 art and clean sortie/end UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re, base64, hashlib, struct, subprocess

          play=Path('play/index.html')
          sp1=Path('play/sp1/sotris/index.html')
          s=play.read_text(encoding='utf-8')
          sp=sp1.read_text(encoding='utf-8')
          before=hashlib.sha256(s.encode()).hexdigest()

          # 1) SP1 v3.8 편대에 실제로 사용된 PNG를 정확히 추출한다.
          # 기존 패치는 PNG를 무시하고 뒤쪽의 첫 WebP를 집어 잘못된 측면/사선 이미지를 사용했다.
          marker='#game.stage5 .skyFormation .plane'
          mi=sp.find(marker)
          if mi < 0:
              raise SystemExit('SP1 stage5 KF21 plane marker missing')
          seg=sp[mi:mi+500000]
          m=re.search(r'background-image\s*:\s*url\(["\']data:image/png;base64,([^"\']+)["\']\)', seg, re.S)
          if not m:
              raise SystemExit('SP1 top-down PNG data URI missing')
          png=base64.b64decode(m.group(1))
          if png[:8] != b'\x89PNG\r\n\x1a\n':
              raise SystemExit('extracted asset is not PNG')
          w,h=struct.unpack('>II',png[16:24])
          if w < 100 or h < 100:
              raise SystemExit(f'PNG dimensions too small: {w}x{h}')
          out=Path('play/assets/kf21-topdown.png')
          out.parent.mkdir(parents=True,exist_ok=True)
          out.write_bytes(png)

          # 2) 선택화면과 실제 플레이 모두 같은 탑뷰 PNG를 사용.
          old_asset='assets/kf21-approved-top.webp?v=20260903-kf21select1'
          new_asset='assets/kf21-topdown.png?v=20260904-kf21top1'
          n=s.count(old_asset)
          if n < 2:
              raise SystemExit(f'old KF21 asset refs unexpected: {n}')
          s=s.replace(old_asset,new_asset)

          # 3) 캐릭터 선택 카드 설명 줄바꿈 정리.
          old_desc="<div class=\"sfCraftDesc\">현재 도감에서 선택한 ${skin.name||'캐릭터'}로 출격<br>기존 공격 · 기존 초필살기</div>"
          new_desc="<div class=\"sfCraftDesc\">현재 선택<br><strong>${skin.name||'캐릭터'}</strong><br>기존 공격 · 기존 초필살기</div>"
          if s.count(old_desc)!=1:
              raise SystemExit(f'character description count={s.count(old_desc)}')
          s=s.replace(old_desc,new_desc,1)

          # 4) 탑뷰 전투기 비율에 맞게 플레이어/옵션 렌더를 정방형에 가깝게 조정.
          old_clone="isKf21?ctx.drawImage(playerImg,-29,-19,58,38):ctx.drawImage(playerImg,-20,-21,40,42)"
          new_clone="isKf21?ctx.drawImage(playerImg,-25,-25,50,50):ctx.drawImage(playerImg,-20,-21,40,42)"
          old_player="isKf21?ctx.drawImage(playerImg,-43,-28,86,56):ctx.drawImage(playerImg,-30,-31,60,62)"
          new_player="isKf21?ctx.drawImage(playerImg,-40,-40,80,80):ctx.drawImage(playerImg,-30,-31,60,62)"
          if s.count(old_clone)<1 or s.count(old_player)<1:
              raise SystemExit(f'KF21 draw patterns missing clone={s.count(old_clone)} player={s.count(old_player)}')
          s=s.replace(old_clone,new_clone)
          s=s.replace(old_player,new_player)

          # 5) KF-21 해금 메시지를 엔딩 카드에서 완전히 분리.
          old_end='''s.innerHTML=`<div class="sfEnding"><div class="sfEndingCard"><div class="earth">🌍✨</div><h2>지구에 평화가 찾아왔다.</h2><p>오소와 친구들이 악의 본거지를 무너뜨렸소!</p><strong>1884 진주중앙시장 파이팅!</strong>${state.spacefighterKf21New?'<div style="margin-top:15px;padding:10px 12px;border:2px solid #77dcff;border-radius:12px;background:#062550;color:#ffe268;font-weight:1000">NEW FIGHTER · KF-21 전투기 해금!<br><span style="font-size:12px;color:#d6efff">다음 출격부터 캐릭터 / KF-21 선택 가능</span></div>':''}</div></div>`;
    victoryFanfare();bombBuzz();
    setTimeout(()=>finish('spacefighter',Math.floor(score+5000),beginSpacefighter,true,bonusCoins),4400)'''
          new_end='''s.innerHTML=`<div class="sfEnding"><div class="sfEndingCard"><div class="earth">🌍✨</div><h2>지구에 평화가 찾아왔다.</h2><p>오소와 친구들이 악의 본거지를 무너뜨렸소!</p><strong>1884 진주중앙시장 파이팅!</strong></div></div>`;
    victoryFanfare();bombBuzz();
    if(state.spacefighterKf21New){
     setTimeout(()=>{
      s.innerHTML=`<div class="sfEnding"><div class="sfEndingCard"><div style="font-size:56px">✈️✨</div><h2>KF-21 전투기 해금!</h2><p>다음 출격부터 선택할 수 있소.</p><strong>캐릭터 / KF-21</strong></div></div>`;
      tone('perfect');buzz([45,20,70,20,120]);
      setTimeout(()=>finish('spacefighter',Math.floor(score+5000),beginSpacefighter,true,bonusCoins),1900)
     },4400)
    }else{
     setTimeout(()=>finish('spacefighter',Math.floor(score+5000),beginSpacefighter,true,bonusCoins),4400)
    }'''
          if s.count(old_end)!=1:
              raise SystemExit(f'ending unlock block count={s.count(old_end)}')
          s=s.replace(old_end,new_end,1)

          # 새 자산 캐시/버전 주석
          s=s.replace('/* SPACEFIGHTER KF21 SELECT v1.0 */','/* SPACEFIGHTER KF21 SELECT v1.1 TOPDOWN */',1)

          play.write_text(s,encoding='utf-8')
          wrong=Path('play/assets/kf21-approved-top.webp')
          if wrong.exists():
              wrong.unlink()

          # 후검증
          assert old_asset not in s
          assert s.count(new_asset)>=2
          assert '현재 선택<br><strong>${skin.name||\'캐릭터\'}</strong><br>' in s
          assert 'NEW FIGHTER · KF-21 전투기 해금!' not in s
          assert 'KF-21 전투기 해금!</h2><p>다음 출격부터 선택할 수 있소.' in s
          assert new_player in s and new_clone in s
          assert 'SPACEFIGHTER KF21 SELECT v1.1 TOPDOWN' in s

          # 모든 인라인 JS 문법 검사
          scripts=re.findall(r'<script[^>]*>(.*?)</script>',s,re.S)
          js='\n'.join(scripts)
          Path('/tmp/oso-inline.js').write_text(js,encoding='utf-8')
          subprocess.run(['node','--check','/tmp/oso-inline.js'],check=True)

          after=hashlib.sha256(s.encode()).hexdigest()
          report='\n'.join([
              'SPACEFIGHTER KF21 TOPDOWN FIX v1.1',
              f'TOPDOWN_PNG={w}x{h}',
              f'TOPDOWN_BYTES={len(png)}',
              'TOPDOWN_SHA256='+hashlib.sha256(png).hexdigest(),
              'OLD_SIDE_ASSET_REMOVED=YES',
              'CHARACTER_CARD_LINEBREAK=YES',
              'UNLOCK_MESSAGE_IN_ENDING=NO',
              'UNLOCK_MESSAGE_AFTER_ENDING=YES',
              'PLAYER_DRAW=80x80',
              'OPTION_DRAW=50x50',
              'INLINE_JS_NODE_CHECK=PASS',
              'PLAY_BEFORE_SHA256='+before,
              'PLAY_AFTER_SHA256='+after,
          ])+'\n'
          Path('.github/spacefighter-kf21-topdown-fix-report.txt').write_text(report,encoding='utf-8')
          PY
          git diff --check
          git config user.name 'PWDJ Spacefighter KF21 Fix'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add -A
          git commit -m 'Fix KF-21 top-down art and post-ending unlock'
          git push

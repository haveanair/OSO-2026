name: Build OSO PWA icons (development branch)
on:
  push:
    branches:
      - feature/oso-bilingual-twa-20261116
    paths:
      - tools/build_oso_icons.py
      - .github/workflows/oso-icons.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Pillow
        run: python -m pip install "Pillow>=10,<13"
      - name: Generate from already approved OSO artwork
        run: python tools/build_oso_icons.py
      - name: Save generated icons to development branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/icons/oso-192.png play/icons/oso-512.png play/icons/oso-maskable-512.png
          if ! git diff --cached --quiet; then
            git commit -m "build(pwa): render official OSO character PNG app icons"
            git push
          else
            echo "Icons unchanged"
          fi

name: OSO Android build
on:
  push:
    branches: [feature/oso-bilingual-twa-20261116, main]
    paths:
      - 'android/**'
      - 'play/icons/**'
      - '.github/workflows/oso-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;35.0.0'
      - name: Build test APK and unsigned release bundle
        working-directory: android
        run: gradle --no-daemon :app:assembleDebug :app:bundleRelease
      - name: Verify package, target SDK and test signature
        working-directory: android
        run: |
          aapt="$ANDROID_HOME/build-tools/35.0.0/aapt"
          apk=app/build/outputs/apk/debug/app-debug.apk
          "$aapt" dump badging "$apk" > apk-info.txt
          grep -F "package: name='io.github.haveanair.osoarcade.debug'" apk-info.txt
          grep -Fx "targetSdkVersion:'36'" apk-info.txt
          grep -F "launchable-activity: name='com.google.androidbrowserhelper.trusted.LauncherActivity'" apk-info.txt
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify "$apk"
          unzip -t app/build/outputs/bundle/release/app-release.aab
      - uses: actions/upload-artifact@v4
        with:
          name: oso-android-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: oso-android-unsigned-aab
          path: android/app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

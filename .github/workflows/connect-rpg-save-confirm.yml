name: Connect RPG save confirmation
on:
  push:
    paths:
      - '.github/workflows/connect-rpg-save-confirm.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Connect save/load confirmation module
        run: python3 .github/connect_rpg_save_confirm.py
      - name: Verify and publish
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'PWDJ RPG Save Confirm'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/index.html .github/rpg-save-confirm-report.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Confirm RPG save and load actions'
          git push

name: Fix KF21 player and Sotris meteor

on:
  push:
    branches: [main]
    paths:
      - '.github/kf21-player-meteor-fix.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply exact fixes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib, re, subprocess

          play=Path('play/index.html')
          sp1=Path('play/sp1/sotris/index.html')
          asset=Path('play/assets/kf21-game-topdown.webp')
          parts=sorted(Path('.github/kf21_topdown_parts').glob('part-*.txt'))
          if len(parts)!=4:
              raise SystemExit(f'payload parts={len(parts)}')

          # Exact user-supplied top-down KF-21, resized only for efficient 80px in-game rendering.
          payload=''.join(p.read_text(encoding='utf-8').strip() for p in parts)
          raw=base64.b64decode(payload,validate=True)
          expected='3ddcb5acd40031554b127e1057041dc11a34ab29d879b648e53fad6d86fe9a14'
          got=hashlib.sha256(raw).hexdigest()
          if got!=expected:
              raise SystemExit(f'KF21 payload SHA mismatch {got}')
          if len(raw)!=19606 or not raw.startswith(b'RIFF') or raw[8:12]!=b'WEBP':
              raise SystemExit('KF21 payload is not expected WebP')
          asset.write_bytes(raw)

          # ---- Spacefighter: in-game only uses top-down asset. Sortie selection stays side/oblique. ----
          s=play.read_text(encoding='utf-8')
          side='assets/kf21-approved-top.webp?v=20260903-kf21select1'
          if side not in s:
              raise SystemExit('sortie side-view reference missing')

          old='assets/kf21-game-topdown.webp?v=20260904-kf21game1'
          new='assets/kf21-game-topdown.webp?v=20260904-kf21game2'
          if s.count(old)!=1:
              # tolerate a previous cache token but require exactly one top-down reference
              matches=re.findall(r'assets/kf21-game-topdown\.webp\?v=[A-Za-z0-9._-]+',s)
              if len(matches)!=1:
                  raise SystemExit(f'topdown refs={matches!r}')
              old=matches[0]
          s=s.replace(old,new,1)
          if new not in s:
              raise SystemExit('new topdown cache token not wired')
          play.write_text(s,encoding='utf-8')

          # ---- Sotris stage 3 shooting star: trajectory is upper-left -> lower-right.
          # Fix body angle and put bright meteor head on the leading (lower-right) end.
          t=sp1.read_text(encoding='utf-8')
          img_re=re.compile(r'data:image/[^;]+;base64,[A-Za-z0-9+/=]+')
          imgs_before=[hashlib.sha256(x.encode()).hexdigest() for x in img_re.findall(t)]

          old_style='.skyShooting{display:none!important;left:8%;top:18%;width:110px;height:2px;background:linear-gradient(90deg,#fff,transparent);box-shadow:0 0 8px #fff;transform:rotate(-25deg)}'
          new_style='.skyShooting{display:none!important;left:8%;top:18%;width:110px;height:2px;background:linear-gradient(90deg,transparent,#fff);box-shadow:0 0 8px #fff;transform:rotate(25deg)}'
          old_anim='#game.stage3 .skyShooting{display:block!important;animation:shoot 4.6s linear infinite}@keyframes shoot{0%,70%{opacity:0;transform:translate(-40px,-20px) rotate(-25deg)}73%{opacity:1}86%{opacity:0;transform:translate(180px,80px) rotate(-25deg)}100%{opacity:0}}'
          new_anim='#game.stage3 .skyShooting{display:block!important;animation:shoot 4.6s linear infinite}@keyframes shoot{0%,70%{opacity:0;transform:translate(-40px,-20px) rotate(25deg)}73%{opacity:1}86%{opacity:0;transform:translate(180px,80px) rotate(25deg)}100%{opacity:0}}'
          if t.count(old_style)!=1:
              raise SystemExit(f'meteor style count={t.count(old_style)}')
          if t.count(old_anim)!=1:
              raise SystemExit(f'meteor animation count={t.count(old_anim)}')
          t=t.replace(old_style,new_style,1).replace(old_anim,new_anim,1)
          imgs_after=[hashlib.sha256(x.encode()).hexdigest() for x in img_re.findall(t)]
          if imgs_before!=imgs_after:
              raise SystemExit('Sotris embedded image data changed')
          sp1.write_text(t,encoding='utf-8')

          # JS syntax checks for both games.
          def check_inline(path):
              x=Path(path).read_text(encoding='utf-8')
              scripts=re.findall(r'<script[^>]*>(.*?)</script>',x,re.S)
              tmp=Path('/tmp')/(Path(path).stem+'-inline.js')
              tmp.write_text('\n'.join(scripts),encoding='utf-8')
              subprocess.run(['node','--check',str(tmp)],check=True)
          check_inline('play/index.html')
          check_inline('play/sp1/sotris/index.html')

          report='\n'.join([
            'KF21 PLAYER + SOTRIS METEOR FIX',
            'KF21_IN_GAME_VIEW=TOPDOWN',
            'KF21_SORTIE_SELECTION_VIEW=SIDE_OBLIQUE_UNCHANGED',
            'KF21_ASSET_BYTES=19606',
            'KF21_ASSET_SHA256='+got,
            'SOTRIS_EMBEDDED_IMAGES_CHANGED=NO',
            'SOTRIS_STAGE3_METEOR_PATH=UPPER_LEFT_TO_LOWER_RIGHT',
            'SOTRIS_STAGE3_METEOR_ANGLE=+25deg',
            'SOTRIS_STAGE3_METEOR_HEAD=LEADING_END',
            'PLAY_INLINE_JS_CHECK=PASS',
            'SOTRIS_INLINE_JS_CHECK=PASS',
          ])+'\n'
          Path('.github/kf21-player-meteor-fix-report.txt').write_text(report,encoding='utf-8')
          PY

          git diff --check
          file play/assets/kf21-game-topdown.webp

          # Remove one-shot transport/build files from final tree.
          git rm -r .github/kf21_topdown_parts
          git rm .github/kf21-player-meteor-fix.trigger
          git rm .github/workflows/fix-kf21-player-and-sotris-meteor.yml

          git config user.name 'PWDJ Game Fix'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/index.html play/assets/kf21-game-topdown.webp play/sp1/sotris/index.html .github/kf21-player-meteor-fix-report.txt
          git commit -m 'Fix KF-21 in-game sprite and Sotris meteor direction'
          git push

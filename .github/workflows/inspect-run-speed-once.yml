name: Inspect runner speed safely once

'on':
  push:
    paths:
      - '.github/workflows/inspect-run-speed-once.yml'

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show runner world and speed lines
        run: |
          grep -n -E 'world|runDist|obs\.forEach|coinList\.forEach|score\+=' play/index.html | sed -n '1,120p' || true

name: Fix Sotris stage 5 sunrise arc
on:
  push:
    paths:
      - '.github/workflows/fix-sotris-sunrise-arc.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch sunrise motion and cache key
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('play/sp1/sotris/index.html')
          s=p.read_text(encoding='utf-8')
          old=""" animation:sunriseLift 6.2s ease-in-out infinite alternate!important
}
@keyframes sunriseLift{
 from{transform:translateY(38px) scale(.94);filter:brightness(.94)}
 to{transform:translateY(-20px) scale(1.03);filter:brightness(1.10)}
}"""
          new=""" animation:sunriseLift 24s cubic-bezier(.22,.61,.36,1) 1 forwards!important
}
@keyframes sunriseLift{
 0%{transform:translate(-12px,54px) scale(.92);filter:brightness(.92)}
 24%{transform:translate(4px,39px) scale(.95);filter:brightness(.96)}
 50%{transform:translate(28px,16px) scale(.98);filter:brightness(1.00)}
 76%{transform:translate(54px,-12px) scale(1.01);filter:brightness(1.05)}
 100%{transform:translate(72px,-42px) scale(1.03);filter:brightness(1.10)}
}"""
          if old not in s:
              raise SystemExit('sunrise source pattern not found')
          if s.count(old)!=1:
              raise SystemExit(f'unexpected sunrise pattern count: {s.count(old)}')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          q=Path('play/sp1/sotris-integration.js')
          t=q.read_text(encoding='utf-8')
          oldkey="?v=20260904-combo2line1"
          newkey="?v=20260904-sunriseArc1"
          if oldkey not in t:
              raise SystemExit('SP1 cache key not found')
          t=t.replace(oldkey,newkey,1)
          q.write_text(t,encoding='utf-8')

          # Invariants: no oscillation and monotonic upward keyframe Y positions.
          assert 'infinite alternate' not in new
          for token in ['translate(-12px,54px)','translate(4px,39px)','translate(28px,16px)','translate(54px,-12px)','translate(72px,-42px)']:
              assert token in s
          Path('.github/sotris-sunrise-arc-report.txt').write_text(
              'SOTRIS STAGE5 SUNRISE ARC VERIFIED\n'
              'MOTION=ONE_WAY_RISING_ARC\n'
              'DURATION=24s\n'
              'REPEAT=NO\n'
              'DESCENT=NO\n'
              'STAGE5_KF21=UNTOUCHED\n'
              'OTHER_STAGE_BACKGROUNDS=UNTOUCHED\n',encoding='utf-8')
          PY
      - name: Commit patch
        run: |
          git config user.name 'PWDJ Sotris Sunrise Fix'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/sp1/sotris/index.html play/sp1/sotris-integration.js .github/sotris-sunrise-arc-report.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Make Sotris sunrise rise once along an arc'
          git push

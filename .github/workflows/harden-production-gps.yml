name: Hide production GPS calibration panel

on:
  push:
    branches: [main]
    paths:
      - '.github/gps-harden.trigger'

permissions:
  contents: write

jobs:
  hide-panel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Hide calibration panel in live play only
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p=Path('play/index.html')
          s=p.read_text(encoding='utf-8')
          marker="function initGpsUi(){\n"
          line=" if(!DEV_ALL_UNLOCKED){const p=$('.gpsCalPanel');if(p)p.style.display='none'}\n"
          if line in s:
              print('panel hide already present')
          else:
              if s.count(marker)!=1:
                  raise SystemExit(f'initGpsUi marker mismatch: {s.count(marker)}')
              s=s.replace(marker,marker+line,1)
              p.write_text(s,encoding='utf-8')

          # Safety: only the UI hide line is introduced; core GPS/calibration code remains untouched.
          out=p.read_text(encoding='utf-8')
          if out.count(line)!=1:
              raise SystemExit('panel hide verification failed')
          if "const cal=state.gpsCalibration||{};" not in out:
              raise SystemExit('gpsZones calibration logic changed unexpectedly')
          if "function saveCalPoint(kind){" not in out:
              raise SystemExit('saveCalPoint changed unexpectedly')
          print('verified: only /play/ hides .gpsCalPanel; GPS logic remains intact')
          PY

          git config user.name 'PWDJ Web Fix'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/index.html
          git diff --cached --quiet && exit 0
          git commit -m 'Hide GPS calibration panel in live play'
          git push

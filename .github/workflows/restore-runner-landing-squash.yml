name: Restore runner landing squash once

'on':
  push:
    paths:
      - '.github/workflows/restore-runner-landing-squash.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply landing squash restore
        run: python .github/restore_runner_landing_squash.py
      - name: Verify diff
        run: git diff --check
      - name: Configure git
        run: |
          git config user.name "PWDJ Runner FX"
          git config user.email "34460283+haveanair@users.noreply.github.com"
      - name: Commit verified patch
        run: |
          git add play/index.html .github/runner-landing-squash-report.txt
          git diff --cached --check
          git commit -m "Restore expressive runner landing squash"
          git push

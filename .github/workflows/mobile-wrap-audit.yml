name: Mobile text wrap audit

on:
  push:
    branches: [qa-wrap-audit]
    paths:
      - '.github/wrap-audit.trigger'
      - '.github/workflows/mobile-wrap-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Korean font
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-cjk
          fc-cache -f
      - name: Install browser driver
        run: python3 -m pip install --quiet playwright
      - name: Run full mobile rendering audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/oso-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          export CHROME
          cat > /tmp/audit.py <<'PY'
          import os,re,json
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          OUT=Path('wrap-audit-output-v3'); OUT.mkdir(exist_ok=True)
          SHOTS=OUT/'screens'; SHOTS.mkdir(exist_ok=True)
          issues=[]; summary=[]; runtime={}
          viewports=[(320,568),(360,640),(390,844),(412,915)]

          scan_js=r'''(label)=>{
            const norm=s=>(s||'').replace(/\s+/g,' ').trim();
            const vis=el=>{const c=getComputedStyle(el),r=el.getBoundingClientRect();return c.display!=='none'&&c.visibility!=='hidden'&&Number(c.opacity)!==0&&r.width>2&&r.height>2&&r.bottom>0&&r.right>0&&r.top<innerHeight&&r.left<innerWidth};
            const pref=el=>{const t=norm(el.innerText);if(t.length<2||t.length>160||['SCRIPT','STYLE','SVG','PATH'].includes(el.tagName))return false;const cl=String(el.className||'');return ['BUTTON','A','P','H1','H2','H3','H4','B','SMALL','STRONG','LABEL'].includes(el.tagName)||/title|desc|need|text|hint|state|best|count|record|level|warn|intro|area|name|score|message|help/i.test(cl)||el.children.length===0};
            function lines(el){const cs=[];const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);let n;while(n=w.nextNode()){const s=n.nodeValue||'';for(let i=0;i<s.length;i++){if(/\s/.test(s[i]))continue;const rg=document.createRange();rg.setStart(n,i);rg.setEnd(n,i+1);const r=rg.getBoundingClientRect();if(r.width>0&&r.height>0)cs.push({c:s[i],t:Math.round(r.top*2)/2,l:r.left})}}cs.sort((a,b)=>Math.abs(a.t-b.t)>1?a.t-b.t:a.l-b.l);const rows=[];for(const c of cs){let z=rows.find(x=>Math.abs(x.t-c.t)<=1.5);if(!z){z={t:c.t,a:[]};rows.push(z)}z.a.push(c)}rows.sort((a,b)=>a.t-b.t);return rows.map(z=>z.a.sort((a,b)=>a.l-b.l).map(x=>x.c).join(''))}
            const out=[], cand=[...document.querySelectorAll('body *')].filter(x=>vis(x)&&pref(x));
            for(const el of cand){const text=norm(el.innerText);if(!text)continue;const c=getComputedStyle(el),r=el.getBoundingClientRect(),ls=lines(el),bad=[];if((el.scrollWidth>el.clientWidth+2||el.scrollHeight>el.clientHeight+2)&&['hidden','clip'].includes(c.overflow))bad.push('CLIPPED');if(ls.length>=2){const last=ls.at(-1).replace(/\s/g,'');if(last.length<=2&&text.replace(/\s/g,'').length>=7)bad.push('ORPHAN_LAST_LINE');if(ls.some((x,i)=>i>0&&/^[·,.:;!?%)\]}]/.test(x)))bad.push('BAD_LINE_START')}if(ls.length>=3&&text.length<=46)bad.push('TOO_MANY_LINES');if((el.tagName==='BUTTON'||el.tagName==='A')&&ls.length>=3)bad.push('BUTTON_3PLUS_LINES');if(bad.length)out.push({label,tag:el.tagName,id:el.id||'',cls:String(el.className||''),text,lines:ls,issues:bad,box:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}})}
            return out;
          }'''

          def load(page):
            page.goto('http://127.0.0.1:8000/play/',wait_until='domcontentloaded',timeout=30000);page.wait_for_timeout(600)
            page.evaluate("""()=>{const b=document.querySelector('#boot');if(b)b.style.display='none';const a=document.querySelector('#app');if(a){a.style.display='flex';a.style.visibility='visible'}const g=document.querySelector('#gameOverlay');if(g)g.classList.remove('show')}""")
            page.wait_for_timeout(100)

          def scan(page,label,w,h):
            arr=page.evaluate(scan_js,label)
            issues.extend([dict(viewport=f'{w}x{h}',**x) for x in arr]);summary.append([f'{w}x{h}',label,len(arr)])
            if arr:
              safe=re.sub(r'[^A-Za-z0-9_.-]+','_',f'{w}x{h}_{label}')[:100]
              page.screenshot(path=str(SHOTS/f'{safe}.png'),full_page=False)

          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True,executable_path=os.environ['CHROME'],args=['--no-sandbox','--disable-dev-shm-usage'])
            for w,h in viewports:
              page=browser.new_page(viewport={'width':w,'height':h})
              load(page)
              if not runtime:
                runtime=page.evaluate("""()=>({font:getComputedStyle(document.body).fontFamily,pages:[...document.querySelectorAll('.page')].map((x,i)=>({i,id:x.id,cls:x.className,hasCards:!!x.querySelector('.gameCard')})),playFns:Object.getOwnPropertyNames(window).filter(k=>/^play/i.test(k)&&typeof window[k]==='function')})""")
              pc=page.locator('.page').count()
              for idx in range(pc):
                page.evaluate("""i=>{document.querySelectorAll('.page').forEach((x,j)=>x.classList.toggle('on',i===j))}""",idx);page.wait_for_timeout(60);scan(page,f'page_{idx:02d}',w,h)
              page.evaluate("""()=>{const p=[...document.querySelectorAll('.page')].find(x=>x.querySelector('.gameCard'));if(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('on'));p.classList.add('on')}}""")
              nc=page.locator('.gameCard').count()
              for idx in range(min(nc,10)):
                page.evaluate("""i=>document.querySelectorAll('.gameCard')[i].click()""",idx);page.wait_for_timeout(60);scan(page,f'modal_{idx+1:02d}',w,h);page.evaluate("""()=>document.querySelectorAll('.modal.show').forEach(x=>x.classList.remove('show'))""")
              names=page.evaluate("""()=>Object.getOwnPropertyNames(window).filter(k=>/^play[A-Z]/.test(k)&&typeof window[k]==='function'&&!/Bgm|Tone|Sound|Audio|Music|Intro|CoinMilestones/i.test(k))""")
              for name in names:
                load(page);ok=page.evaluate("""n=>{try{window[n]();return true}catch(e){return String(e)}}""",name)
                if ok is not True: summary.append([f'{w}x{h}',name+'_ERROR',ok]);continue
                page.wait_for_timeout(120);scan(page,name+'_intro',w,h)
                page.evaluate("""()=>{const b=document.querySelector('.gameIntro button');if(b)b.click()}""");page.wait_for_timeout(120);scan(page,name+'_active',w,h)
              page.close()
            browser.close()

          src=Path('play/index.html').read_text(encoding='utf-8')
          br=[]
          for m in re.finditer(r'.{0,110}<br\s*/?>.{0,110}',src,re.I|re.S):
            z=re.sub(r'\s+',' ',m.group(0));
            if re.search('[가-힣]',z):br.append(z[:260])
          data={'runtime':runtime,'summary':summary,'issues':issues,'explicit_br_count':len(br),'explicit_br_contexts':br}
          (OUT/'report.json').write_text(json.dumps(data,ensure_ascii=False,indent=2),encoding='utf-8')
          with (OUT/'report.txt').open('w',encoding='utf-8') as f:
            f.write('RUNTIME '+json.dumps(runtime,ensure_ascii=False)+'\nTOTAL '+str(len(issues))+'\nBR '+str(len(br))+'\n')
            for row in summary:f.write('SUMMARY\t'+'\t'.join(map(str,row))+'\n')
            for x in issues:f.write(f"ISSUE\t{x['viewport']}\t{x['label']}\t{','.join(x['issues'])}\nTEXT\t{x['text']}\nLINES\t{' / '.join(x['lines'])}\n")
          print((OUT/'report.txt').read_text(encoding='utf-8'))
          PY
          python3 /tmp/audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-wrap-audit-v3
          path: wrap-audit-output-v3

name: Mobile text wrap audit

on:
  push:
    branches: [qa-wrap-audit]
    paths:
      - '.github/wrap-audit.trigger'
      - '.github/workflows/mobile-wrap-audit.yml'

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install browser driver
        run: python3 -m pip install --quiet playwright
      - name: Run mobile rendering audit
        shell: bash
        run: |
          set -euo pipefail
          python3 -m http.server 8000 >/tmp/oso-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID || true' EXIT
          sleep 1
          CHROME="$(command -v google-chrome-stable || command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'Chrome/Chromium not found'; exit 1
          fi
          echo "Using browser: $CHROME"
          export CHROME
          cat > /tmp/audit.py <<'PY'
          import os, re, json, time
          from pathlib import Path
          from playwright.sync_api import sync_playwright

          OUT=Path('wrap-audit-output')
          OUT.mkdir(exist_ok=True)
          shots=OUT/'screens'
          shots.mkdir(exist_ok=True)
          report=[]
          summary=[]
          viewports=[(320,568),(360,640),(390,844),(412,915)]
          game_fns={
            '01_basket':['playBasket'],
            '02_fish':['playFish'],
            '03_stack':['playStack'],
            '04_run':['playRun'],
            '05_slice':['playSlice'],
            '06_tteok':['playTteok'],
            '07_powerduck':['playPowerduck'],
            '08_spacefighter':['playSpacefighter','playSpaceFighter','playSpace'],
            '09_racing':['playRacing'],
            '10_fantasy':['playFantasy']
          }

          scan_js=r'''(label) => {
            const norm=s=>(s||'').replace(/\s+/g,' ').trim();
            const visible=el=>{
              const cs=getComputedStyle(el),r=el.getBoundingClientRect();
              return cs.display!=='none'&&cs.visibility!=='hidden'&&Number(cs.opacity)!==0&&r.width>2&&r.height>2&&r.bottom>0&&r.right>0&&r.top<innerHeight&&r.left<innerWidth;
            };
            const preferred=el=>{
              const t=norm(el.innerText);
              if(t.length<2||t.length>140)return false;
              if(['SCRIPT','STYLE','SVG','PATH'].includes(el.tagName))return false;
              const tag=el.tagName;
              const cls=String(el.className||'');
              if(['BUTTON','A','P','H1','H2','H3','H4','B','SMALL','STRONG','LABEL'].includes(tag))return true;
              if(/title|desc|need|text|hint|state|best|count|record|level|warn|intro|area|name|score|message/i.test(cls))return true;
              return el.children.length===0;
            };
            function linesFor(el){
              const chars=[];
              const w=document.createTreeWalker(el,NodeFilter.SHOW_TEXT);
              let node;
              while(node=w.nextNode()){
                const raw=node.nodeValue||'';
                for(let i=0;i<raw.length;i++){
                  const ch=raw[i]; if(/\s/.test(ch)) continue;
                  const rg=document.createRange(); rg.setStart(node,i); rg.setEnd(node,i+1);
                  const rr=rg.getBoundingClientRect();
                  if(rr.width>0&&rr.height>0) chars.push({ch,top:Math.round(rr.top*2)/2,left:rr.left});
                }
              }
              chars.sort((a,b)=>Math.abs(a.top-b.top)>1?a.top-b.top:a.left-b.left);
              const rows=[];
              for(const c of chars){
                let row=rows.find(x=>Math.abs(x.top-c.top)<=1.5);
                if(!row){row={top:c.top,chars:[]};rows.push(row)}
                row.chars.push(c);
              }
              rows.sort((a,b)=>a.top-b.top);
              return rows.map(r=>r.chars.sort((a,b)=>a.left-b.left).map(x=>x.ch).join(''));
            }
            const out=[];
            const candidates=[...document.querySelectorAll('body *')].filter(el=>visible(el)&&preferred(el));
            for(const el of candidates){
              const text=norm(el.innerText); if(!text)continue;
              const cs=getComputedStyle(el),r=el.getBoundingClientRect();
              const lines=linesFor(el);
              const issues=[];
              if((el.scrollWidth>el.clientWidth+2 || el.scrollHeight>el.clientHeight+2) && ['hidden','clip'].includes(cs.overflow)) issues.push('CLIPPED');
              if(lines.length>=2){
                const last=lines[lines.length-1].replace(/\s/g,'');
                if(last.length<=2 && text.replace(/\s/g,'').length>=7) issues.push('ORPHAN_LAST_LINE');
                if(lines.some((x,i)=>i>0 && /^[·,.:;!?%)\]}]/.test(x))) issues.push('BAD_LINE_START');
              }
              if(lines.length>=3 && text.length<=42) issues.push('TOO_MANY_LINES');
              if((el.tagName==='BUTTON'||el.tagName==='A') && lines.length>=3) issues.push('BUTTON_3PLUS_LINES');
              if(issues.length){
                out.push({label,tag:el.tagName,cls:String(el.className||''),id:el.id||'',text,lines,issues,box:{x:Math.round(r.x),y:Math.round(r.y),w:Math.round(r.width),h:Math.round(r.height)}})
              }
            }
            // Leaf text overlap check, excluding nested parent/child pairs.
            const leaves=candidates.filter(el=>el.children.length===0 && norm(el.innerText).length>=2);
            for(let i=0;i<leaves.length;i++) for(let j=i+1;j<leaves.length;j++){
              const a=leaves[i],b=leaves[j]; if(a.contains(b)||b.contains(a))continue;
              const ra=a.getBoundingClientRect(), rb=b.getBoundingClientRect();
              const ix=Math.min(ra.right,rb.right)-Math.max(ra.left,rb.left);
              const iy=Math.min(ra.bottom,rb.bottom)-Math.max(ra.top,rb.top);
              if(ix>4&&iy>4){
                const ta=norm(a.innerText),tb=norm(b.innerText);
                if(ta!==tb) out.push({label,tag:'OVERLAP',cls:'',id:'',text:`${ta}  <->  ${tb}`,lines:[],issues:['TEXT_OVERLAP'],box:{x:Math.round(Math.max(ra.left,rb.left)),y:Math.round(Math.max(ra.top,rb.top)),w:Math.round(ix),h:Math.round(iy)}})
              }
            }
            return out;
          }'''

          def prepare(page):
            page.goto('http://127.0.0.1:8000/play/', wait_until='domcontentloaded', timeout=30000)
            page.wait_for_timeout(700)
            page.evaluate("""() => {
              const b=document.querySelector('#boot'); if(b)b.style.display='none';
              const a=document.querySelector('#app'); if(a){a.style.display='flex';a.style.visibility='visible'}
              const g=document.querySelector('#gameOverlay'); if(g)g.classList.remove('show');
            }""")
            page.wait_for_timeout(150)

          def do_scan(page,label,w,h):
            items=page.evaluate(scan_js,label)
            if items:
              safe=re.sub(r'[^A-Za-z0-9_.-]+','_',f'{w}x{h}_{label}')[:120]
              page.screenshot(path=str(shots/f'{safe}.png'), full_page=False)
            report.extend([dict(viewport=f'{w}x{h}',**x) for x in items])
            summary.append((f'{w}x{h}',label,len(items)))
            return items

          with sync_playwright() as p:
            browser=p.chromium.launch(headless=True, executable_path=os.environ['CHROME'], args=['--no-sandbox','--disable-dev-shm-usage'])
            for w,h in viewports:
              page=browser.new_page(viewport={'width':w,'height':h}, device_scale_factor=1)
              prepare(page)
              # Main game list
              do_scan(page,'games_list',w,h)
              # Each locked/unlocked info modal
              cards=page.locator('.gameCard')
              n=min(cards.count(),10)
              for i in range(n):
                try:
                  cards.nth(i).click(force=True,timeout=1500)
                  page.wait_for_timeout(80)
                  do_scan(page,f'game_modal_{i+1:02d}',w,h)
                  page.evaluate("""() => { const m=document.querySelector('.modal.show'); if(m)m.classList.remove('show') }""")
                except Exception as e:
                  summary.append((f'{w}x{h}',f'game_modal_{i+1:02d}_ERROR',str(e)[:120]))
              # Other main tabs
              nav=page.locator('nav button')
              for idx,name in [(1,'market_explore'),(2,'oso_guide')]:
                try:
                  nav.nth(idx).click(force=True,timeout=1500); page.wait_for_timeout(100); do_scan(page,name,w,h)
                except Exception as e: summary.append((f'{w}x{h}',name+'_ERROR',str(e)[:120]))
              # Game screens: intro + active screen
              for gname,cands in game_fns.items():
                prepare(page)
                chosen=page.evaluate("""(names)=>{for(const n of names){if(typeof window[n]==='function'){window[n]();return n}}return ''}""",cands)
                if not chosen:
                  summary.append((f'{w}x{h}',gname+'_MISSING_FN',','.join(cands))); continue
                page.wait_for_timeout(180)
                do_scan(page,gname+'_intro',w,h)
                # Start/dismiss intro if present
                try:
                  intro_btn=page.locator('.gameIntro button')
                  if intro_btn.count()>0 and intro_btn.first.is_visible():
                    intro_btn.first.click(force=True,timeout=1000); page.wait_for_timeout(160)
                except Exception: pass
                do_scan(page,gname+'_active',w,h)
              page.close()
            browser.close()

          # Static source check for explicit BRs and long Korean UI literals.
          src=Path('play/index.html').read_text(encoding='utf-8')
          br=[]
          for m in re.finditer(r'.{0,90}<br\s*/?>.{0,90}',src,re.I|re.S):
            s=re.sub(r'\s+',' ',m.group(0))
            if re.search('[가-힣]',s): br.append(s[:220])
          static={'explicit_br_contexts':br[:120], 'explicit_br_count':len(br)}
          (OUT/'report.json').write_text(json.dumps({'summary':summary,'issues':report,'static':static},ensure_ascii=False,indent=2),encoding='utf-8')
          with (OUT/'report.txt').open('w',encoding='utf-8') as f:
            f.write('=== MOBILE WRAP AUDIT SUMMARY ===\n')
            for row in summary:f.write('\t'.join(map(str,row))+'\n')
            f.write(f'\nTOTAL ISSUES: {len(report)}\n')
            f.write(f'EXPLICIT <br> CONTEXTS: {len(br)}\n\n')
            for x in report:
              f.write(f"[{x['viewport']}] {x['label']} | {','.join(x['issues'])} | {x['tag']}#{x['id']}.{x['cls']}\n")
              f.write('TEXT: '+x['text']+'\n')
              if x['lines']: f.write('LINES: '+' / '.join(x['lines'])+'\n')
              f.write('BOX: '+json.dumps(x['box'],ensure_ascii=False)+'\n\n')
          print((OUT/'report.txt').read_text(encoding='utf-8'))
          PY
          python3 /tmp/audit.py
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-wrap-audit
          path: wrap-audit-output

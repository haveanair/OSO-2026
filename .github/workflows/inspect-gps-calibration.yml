name: Inspect GPS calibration

on:
  push:
    branches: [main]
    paths:
      - '.github/gps-inspect.trigger'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inspect calibration code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          s=Path('play/index.html').read_text(encoding='utf-8')
          keys=['gpsCalibration','GPS_DEFAULTS','보정','calibrat','현재 위치','시작점 저장','끝점 저장','중심 저장']
          for k in keys:
              print('\n===== KEY:',k,'COUNT',s.count(k),'=====')
              start=0
              n=0
              while True:
                  i=s.find(k,start)
                  if i<0: break
                  n+=1
                  a=max(0,i-500); b=min(len(s),i+900)
                  print(f'--- {k} #{n} @ {i} ---')
                  print(s[a:b].replace('\n','\\n'))
                  start=i+len(k)
          PY

name: Spread GPS checkpoints

on:
  push:
    branches: [main]
    paths:
      - '.github/gps-inspect.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace overlapping GPS zones
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64,math
          p=Path('play/index.html')
          s=p.read_text(encoding='utf-8')
          defaults_b64=''
          eval_b64=''
          new_defaults=base64.b64decode(defaults_b64).decode('utf-8')
          new_eval=base64.b64decode(eval_b64).decode('utf-8')
          a=s.find('const GPS_DEFAULTS={')
          b=s.find('\n};\nlet gpsWatchId',a)
          if a<0 or b<0: raise SystemExit('GPS_DEFAULTS block not found')
          s=s[:a]+new_defaults+s[b+3:]
          a=s.find('function evaluateGpsPosition(pos){')
          b=s.find('\nfunction renderGpsLocations',a)
          if a<0 or b<0: raise SystemExit('evaluateGpsPosition block not found')
          s=s[:a]+new_eval+s[b:]
          block=s[s.find('function evaluateGpsPosition(pos){'):s.find('\nfunction renderGpsLocations',s.find('function evaluateGpsPosition(pos){'))]
          if block.count('unlockByGps(')!=1: raise SystemExit('expected exactly one GPS unlock call')
          if 'const closest=ranked[0]' not in block: raise SystemExit('nearest-zone guard missing')
          pts={'fish':(35.195345669871315,128.085359345818659),'stack':(35.194615480555584,128.085613224989288),'run':(35.194274577002346,128.085685647616630),'slice':(35.194941119149156,128.084694391285779),'tteok':(35.195225039986212,128.084952409084787),'powerduck':(35.194613594496,128.08480142824)}
          def d(a,b):
              R=6371000; p1=math.radians(a[0]); p2=math.radians(b[0]); dp=math.radians(b[0]-a[0]); dl=math.radians(b[1]-a[1]); h=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2; return 2*R*math.asin(math.sqrt(h))
          pairs=[(d(pts[a],pts[b]),a,b) for i,a in enumerate(pts) for b in list(pts)[i+1:]]
          mind=min(pairs)
          if mind[0] <= 28: raise SystemExit('14m checkpoint circles overlap')
          print('minimum checkpoint separation',round(mind[0],1),'m',mind[1],mind[2])
          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'PWDJ GPS Fix'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/index.html
          git commit -m 'Spread GPS checkpoints across market'
          git push

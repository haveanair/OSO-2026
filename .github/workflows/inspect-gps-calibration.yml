name: Inspect GPS unlock overlap

on:
  push:
    branches: [main]
    paths:
      - '.github/gps-inspect.trigger'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Save GPS unlock contexts
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          s=Path('play/index.html').read_text(encoding='utf-8')
          keys=['35.197412338175','35.194613594496','1030078','1034002','1030104','1020021','1020051','1020033','1030106','1030006','1030015','startGpsWatch','watchPosition','getCurrentPosition','gpsUnlock','GPS_UNLOCK','unlockByGps','pointToSegment','distanceToSegment','haversine']
          out=[]
          seen=[]
          for k in keys:
              positions=[]
              start=0
              while True:
                  i=s.find(k,start)
                  if i<0: break
                  positions.append(i); start=i+len(k)
              out.append(f'===== KEY: {k} COUNT {len(positions)} =====')
              for n,i in enumerate(positions[:8],1):
                  a=max(0,i-1800); b=min(len(s),i+2600)
                  # de-dupe very similar windows
                  sig=(a,b)
                  if any(abs(a-x)<500 for x,_ in seen):
                      continue
                  seen.append(sig)
                  out.append(f'--- {k} #{n} @ {i} ---')
                  out.append(s[a:b])
          Path('.github/gps-overlap-inspection.txt').write_text('\n\n'.join(out),encoding='utf-8')
          PY
          git config user.name 'PWDJ GPS Inspect'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add .github/gps-overlap-inspection.txt
          git commit -m 'Save GPS overlap inspection' || exit 0
          git push

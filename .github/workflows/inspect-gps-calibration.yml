name: Spread GPS checkpoints

on:
  push:
    branches: [main]
    paths:
      - '.github/gps-inspect.trigger'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Replace overlapping corridors with distributed checkpoints
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import math,re
          p=Path('play/index.html')
          s=p.read_text(encoding='utf-8')

          # Keep all seven named zones, but use one representative checkpoint inside each zone.
          # Points were selected along the existing GrowMaps corridor references to maximize separation.
          new_defaults="""const GPS_DEFAULTS={
 basket:{type:'circle',lat:35.197412338175,lng:128.08448465174,radius:45,near:180,source:'public-address'},
 fish:{type:'circle',lat:35.195345669871315,lng:128.085359345818659,radius:14,near:95,source:'growmaps:project75:1F:3gu-fish-checkpoint'},
 stack:{type:'circle',lat:35.194615480555584,lng:128.085613224989288,radius:14,near:95,source:'growmaps:project75:1F:2gu-checkpoint'},
 run:{type:'circle',lat:35.194274577002346,lng:128.085685647616630,radius:14,near:95,source:'growmaps:project75:1F:1gu-checkpoint'},
 slice:{type:'circle',lat:35.194941119149156,lng:128.084694391285779,radius:14,near:95,source:'growmaps:project75:1F:new-food-alley-checkpoint'},
 tteok:{type:'circle',lat:35.195225039986212,lng:128.084952409084787,radius:14,near:95,source:'growmaps:project75:1F:north-checkpoint'},
 powerduck:{type:'circle',lat:35.194613594496,lng:128.08480142824,radius:14,near:95,source:'public-address'}
};"""

          a=s.find('const GPS_DEFAULTS={')
          if a<0: raise SystemExit('GPS_DEFAULTS start not found')
          b=s.find('\n};\nlet gpsWatchId',a)
          if b<0: raise SystemExit('GPS_DEFAULTS end not found')
          b+=3
          s=s[:a]+new_defaults+s[b:]

          old_start=s.find('function evaluateGpsPosition(pos){')
          if old_start<0: raise SystemExit('evaluateGpsPosition start not found')
          old_end=s.find('\nfunction renderGpsLocations',old_start)
          if old_end<0: raise SystemExit('evaluateGpsPosition end not found')
          new_eval="""function evaluateGpsPosition(pos){
 const z=gpsZones(),acc=Number(pos&&pos.accuracy)||999;
 // 실내 GPS가 지나치게 흔들릴 때 엉뚱한 구역을 해금하지 않는다.
 if(acc>140){renderGpsLocations(pos);return}
 // 한 위치에서는 가장 가까운 구역 하나만 해금 후보가 된다.
 // 이미 획득한 구역도 거리 비교에 포함해 같은 자리에서 다음 게임이 연쇄 해금되지 않게 한다.
 const ranked=GAME_ACQUIRE.map(loc=>{
  const zone=z[loc.code],target=zoneTarget(zone);
  if(!zone||!target)return null;
  return {loc,zone,target,centerD:metersBetween(pos,target),d:effectiveZoneDistanceM(pos,zone)}
 }).filter(Boolean).sort((a,b)=>a.centerD-b.centerD);
 const closest=ranked[0];
 if(closest){
  if(zoneInside(pos,closest.zone))unlockByGps(closest.loc.code);
  else if(closest.d <= (closest.zone.near||95) && !acquiredByAny(closest.loc.code))showDirection(closest.loc.code,closest.d,pos,closest.zone)
 }
 renderGpsLocations(pos)
}"""
          s=s[:old_start]+new_eval+s[old_end:]

          # Static verification.
          if s.count('function evaluateGpsPosition(pos){')!=1: raise SystemExit('evaluate function count invalid')
          eval_block=s[s.find('function evaluateGpsPosition(pos){'):s.find('\nfunction renderGpsLocations',s.find('function evaluateGpsPosition(pos){'))]
          if eval_block.count('unlockByGps(')!=1: raise SystemExit('evaluateGpsPosition must have exactly one unlock call')
          if 'const closest=ranked[0]' not in eval_block: raise SystemExit('nearest-zone guard missing')

          pts={
           'fish':(35.195345669871315,128.085359345818659),'stack':(35.194615480555584,128.085613224989288),
           'run':(35.194274577002346,128.085685647616630),'slice':(35.194941119149156,128.084694391285779),
           'tteok':(35.195225039986212,128.084952409084787),'powerduck':(35.194613594496,128.08480142824)
          }
          def dist(x,y):
           lat1,lon1=x;lat2,lon2=y
           r=6371000
           p1=math.radians(lat1);p2=math.radians(lat2)
           dp=math.radians(lat2-lat1);dl=math.radians(lon2-lon1)
           h=math.sin(dp/2)**2+math.cos(p1)*math.cos(p2)*math.sin(dl/2)**2
           return 2*r*math.asin(math.sqrt(h))
          pairs=[]
          names=list(pts)
          for i in range(len(names)):
           for j in range(i+1,len(names)):
            d=dist(pts[names[i]],pts[names[j]])
            pairs.append((d,names[i],names[j]))
          mind=min(pairs)
          if mind[0] <= 28: raise SystemExit(f'checkpoint circles overlap: {mind}')
          print('minimum inner checkpoint separation:',round(mind[0],1),'m',mind[1],mind[2])
          print('verified: raw 14m checkpoint circles do not overlap and only nearest zone can unlock')

          p.write_text(s,encoding='utf-8')
          PY
          git config user.name 'PWDJ GPS Fix'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/index.html
          git commit -m 'Spread GPS checkpoints across market'
          git push

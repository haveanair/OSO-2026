name: Cleanup Nongae catalog copy
on:
  push:
    paths:
      - '.github/workflows/cleanup-nongae-catalog-copy.yml'
      - '.github/nongae_catalog_copy_cleanup.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Remove repeated Nongae unlock text
        shell: bash
        run: |
          set -euo pipefail
          python3 .github/nongae_catalog_copy_cleanup.py
          git diff --check
          git config user.name 'PWDJ Nongae Copy Cleanup'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/index.html .github/nongae-catalog-copy-cleanup-report.txt
          git commit -m 'Reduce repeated Nongae unlock text'
          git push

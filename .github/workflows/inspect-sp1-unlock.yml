name: Inspect SP1 unlock bridge

on:
  push:
    branches: [main]
    paths:
      - '.github/sp1-unlock-inspect.trigger'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Extract SP1 unlock context
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=Path('play/index.html').read_text(encoding='utf-8')
          out=[f'PLAY_LEN={len(s)}']

          marker='const OSO_SKINS='
          pos=s.index(marker)+len(marker)
          skins,end=json.JSONDecoder().raw_decode(s[pos:])
          out.append('\n===== OSO_SKINS COMPACT =====')
          out.append(f'COUNT={len(skins)}')
          for i,x in enumerate(skins):
              out.append(f"{i}: id={x.get('id')!r} name={x.get('name')!r} price={x.get('price')!r} group={x.get('group')!r}")
          paid=[x for x in skins if (x.get('group') or 'oso')=='oso' and float(x.get('price') or 0)>0]
          out.append('SP1_FILTER_IDS='+repr([x.get('id') for x in paid]))

          for key in ['function renderOsoShop','ownedSkins.push','ownedSkins.includes','selectedSkin','specialUnlocks','sotris-integration.js']:
              poss=[]; start=0
              while True:
                  i=s.find(key,start)
                  if i<0: break
                  poss.append(i); start=i+1
              out.append(f'\n===== {key} COUNT {len(poss)} =====')
              for n,i in enumerate(poss[:12],1):
                  a=max(0,i-1200); b=min(len(s),i+2200)
                  out.append(f'\n--- #{n} @ {i} ---\n{s[a:b]}')
          Path('.github/sp1-unlock-inspection.txt').write_text('\n'.join(out),encoding='utf-8')
          PY
          git config user.name 'PWDJ SP1 Inspector'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add .github/sp1-unlock-inspection.txt
          git commit -m 'Inspect SP1 unlock item mapping'
          git push

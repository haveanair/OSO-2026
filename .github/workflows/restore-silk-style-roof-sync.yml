name: Restore silk judgement style and roof sync

on:
  push:
    paths:
      - '.github/workflows/restore-silk-style-roof-sync.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python3 .github/scripts/restore_silk_style_roof_sync_v2.py
      - name: Validate
        run: |
          node --check play/character-performance-bonus.js
          node --check play/silk-stack-endless.js
          ! grep -q 'function showStackJudgementBurst' play/character-performance-bonus.js
          grep -q 'function showStackGreatBurst' play/character-performance-bonus.js
          grep -q 'function showStackPerfectBurst' play/character-performance-bonus.js
          grep -q 'roofImpactVibrate' play/silk-stack-endless.js
          grep -q '20260908-roofsync1' play/index.html
          grep -q '20260908-judgestyle-restore1' play/index.html
      - name: Commit patched files
        run: |
          if git diff --quiet -- play/character-performance-bonus.js play/silk-stack-endless.js play/index.html; then
            echo 'No changes needed'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add play/character-performance-bonus.js play/silk-stack-endless.js play/index.html
          git commit -m '비단 판정 이전 스타일 복원 및 지붕 충격음 진동 동기화'
          git push

name: Fix shooting movement and verify SOTRIS once

'on':
  push:
    paths:
      - '.github/workflows/fix-shooting-movement-sotris.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch
        run: python .github/fix_shooting_movement_and_verify_sotris.py
      - name: Check diff
        run: git diff --check
      - name: Configure git
        run: |
          git config user.name "PWDJ Shooting Fix"
          git config user.email "34460283+haveanair@users.noreply.github.com"
      - name: Commit verified files
        run: |
          git add play/index.html play/character-special-abilities.js .github/shooting-movement-sotris-report.txt
          git diff --cached --check
          git commit -m "Use character movement boost instead of shooting fire rate"
          git push

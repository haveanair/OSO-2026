name: Apply wrap copy fixes

on:
  push:
    branches: [qa-wrap-audit]
    paths:
      - '.github/apply-wrap-fixes.trigger'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Apply final wrap fix
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('play/index.html')
          s=p.read_text(encoding='utf-8')
          old='2단점프 · GREAT 시 3단점프 · LEVEL 5 돌파'
          new='2단점프 · GREAT 시 3단점프 · LV5 돌파'
          n=s.count(old)
          if n != 1:
              raise SystemExit(f'Expected exactly 1 occurrence, got {n}: {old}')
          s=s.replace(old,new)
          p.write_text(s,encoding='utf-8')
          PY
          git diff --check
          git diff -- play/index.html
      - name: Commit to main
        run: |
          git config user.name 'PWDJ'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/index.html
          git commit -m 'Finalize mobile text wrap cleanup'
          git push origin HEAD:main

name: Integrate Nongae v2
on:
  push:
    paths:
      - '.github/workflows/integrate-nongae-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore final Nongae assets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import base64, hashlib
          pairs=[
            ('.github/nongae01_final.b64','play/assets/nongae-01.webp','be7a984bf0359ed4cc0b877652c4055f4d127614e6e108ba68d7ad13581c80d1'),
            ('.github/nongae02_final.b64','play/assets/nongae-02.webp','8400bd0b49965a46f2300f69e93bf82bbc3cba60ff9860abdc5afbe568e38337'),
          ]
          for src,dst,expected in pairs:
              data=base64.b64decode(Path(src).read_text(encoding='utf-8').strip(),validate=True)
              got=hashlib.sha256(data).hexdigest()
              if got!=expected:
                  raise SystemExit(f'{src} hash mismatch {got}')
              if data[:4]!=b'RIFF' or data[8:12]!=b'WEBP':
                  raise SystemExit(f'{src} is not WEBP')
              Path(dst).write_bytes(data)
              print(dst, len(data), got)
          PY
      - name: Apply and verify Nongae integration
        shell: bash
        run: |
          set +e
          python3 .github/nongae_patch.py > /tmp/nongae-final.log 2>&1
          rc=$?
          cat /tmp/nongae-final.log
          if [ "$rc" -ne 0 ]; then
            cp /tmp/nongae-final.log .github/nongae-final-failure.txt
            git config user.name 'PWDJ Nongae Diagnostics'
            git config user.email '34460283+haveanair@users.noreply.github.com'
            git add .github/nongae-final-failure.txt
            git commit -m 'Record finalized Nongae integration failure' || true
            git push || true
            exit "$rc"
          fi
          set -euo pipefail
          git diff --check
          git config user.name 'PWDJ Nongae Integration'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/index.html play/assets/nongae-01.webp play/assets/nongae-02.webp .github/nongae-integration-report.txt
          git commit -m 'Add Nongae unlock and Heavenly Jade Ring Attack'
          git push

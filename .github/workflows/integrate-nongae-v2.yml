name: Integrate Nongae v2
# corrected Nongae 02 asset run
on:
  push:
    paths:
      - '.github/workflows/integrate-nongae-v2.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply and verify Nongae integration
        shell: bash
        run: |
          set +e
          python3 .github/nongae_patch.py > /tmp/nongae-final.log 2>&1
          rc=$?
          cat /tmp/nongae-final.log
          if [ "$rc" -ne 0 ]; then
            cp /tmp/nongae-final.log .github/nongae-final-failure.txt
            git config user.name 'PWDJ Nongae Diagnostics'
            git config user.email '34460283+haveanair@users.noreply.github.com'
            git add .github/nongae-final-failure.txt
            git commit -m 'Record finalized Nongae integration failure' || true
            git push || true
            exit "$rc"
          fi
          set -euo pipefail
          git diff --check
          git config user.name 'PWDJ Nongae Integration'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/index.html .github/nongae-integration-report.txt
          git commit -m 'Add Nongae unlock and Heavenly Jade Ring Attack'
          git push

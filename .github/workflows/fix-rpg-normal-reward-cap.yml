name: Fix RPG normal monster reward cap
on:
  push:
    paths:
      - '.github/workflows/fix-rpg-normal-reward-cap.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Cap normal monster battle rewards
        run: python3 .github/rpg_normal_reward_cap_fix.py
      - name: Verify and publish
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'PWDJ RPG Reward Cap Fix'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/index.html .github/rpg-normal-reward-cap-fix-report.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Cap RPG normal monster coin rewards at 100'
          git push

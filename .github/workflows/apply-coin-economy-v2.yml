name: Apply coin economy v2

on:
  push:
    branches: [main]
    paths:
      - '.github/coin-economy-v2.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch rewards safely
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          p=Path('play/index.html')
          s=p.read_text(encoding='utf-8')
          changes=[]

          def one(old,new,label):
              global s
              c=s.count(old)
              if c!=1: raise SystemExit(f'{label}: expected 1, got {c}')
              s=s.replace(old,new,1);changes.append(label)
          def many(old,new,count,label):
              global s
              c=s.count(old)
              if c!=count: raise SystemExit(f'{label}: expected {count}, got {c}')
              s=s.replace(old,new);changes.append(label)

          # 1) Common completion reward: old maximum 120 -> exactly 240.
          one("let reward=Math.max(5,Math.min(90,Math.floor(score/10)||5));if(clear)reward+=30;",
              "let reward=Math.max(5,Math.min(90,Math.floor(score/10)||5))*2;if(clear)reward+=60; const clearBonus=(clear&&code==='fantasy')?3000:0;",
              'common reward x2 + RPG 3000 declaration')
          one('state.coins=beforeCoins+reward+bonusCoins;','state.coins=beforeCoins+reward+bonusCoins+clearBonus;','RPG 3000 wallet credit')

          # Make result screen show the true total and an explicit RPG clear-bonus breakdown.
          a=s.find('function finish(code,score,retry,clear=false,bonusCoins=0){')
          b=s.find('function readyThen(',a)
          if a<0 or b<0: raise SystemExit('finish scope missing')
          f=s[a:b]
          k=f.find('const bonusLabel=')
          if k<0: raise SystemExit('bonusLabel missing')
          semi=f.find(';',k)
          if semi<0: raise SystemExit('bonusLabel terminator missing')
          extra=" const rewardTotal=reward+bonusCoins+clearBonus;const rewardParts=[`기본 ${reward}`];if(bonusCoins)rewardParts.push(`${bonusLabel} ${bonusCoins}`);if(clearBonus)rewardParts.push(`RPG 클리어 보너스 ${clearBonus}`);const rewardDetail=(bonusCoins||clearBonus)?` (${rewardParts.join(' + ')})`:'';"
          f=f[:semi+1]+extra+f[semi+1:]
          ds=f.find('<div>🪙 +${reward+bonusCoins}')
          de_token=' · 현재 보유 ${state.coins}</div>'
          de=f.find(de_token,ds)
          if ds<0 or de<0: raise SystemExit('reward result line missing')
          de+=len(de_token)
          f=f[:ds]+'<div>🪙 +${rewardTotal}${rewardDetail} · 현재 보유 ${state.coins}</div>'+f[de:]
          s=s[:a]+f+s[b:];changes.append('result reward breakdown')

          # 2) Physical coin pickups. Run is a deliberate +5 exception.
          one('if(gotCoin)bonusCoins++;','if(gotCoin)bonusCoins+=10;','basket pickup +10')
          one("gotCoin?`🪙 +1 · +${pts}점`","gotCoin?`🪙 +10 · +${pts}점`",'basket feedback +10')
          many('bonusCoins++;score+=35','bonusCoins+=10;score+=35',2,'fish + slice pickup +10')
          many("fxText(x,y,'🪙 +1','#c77b00')","fxText(x,y,'🪙 +10','#c77b00')",2,'fish + slice feedback +10')
          one('bonusCoins++;score+=40','bonusCoins+=10;score+=40','spacefighter pickup +10')
          one('toast(`🪙 코인 +1 · 누적 +${bonusCoins}`)','toast(`🪙 코인 +10 · 누적 +${bonusCoins}`)','spacefighter feedback +10')

          # Run: keep count and score unchanged; only payout is five per physical coin.
          old_run="finish('run',Math.floor(score+coins*30),playRun,false,coins)"
          c=s.count(old_run)
          if c<1: raise SystemExit(f'run finish payout missing: {c}')
          s=s.replace(old_run,"finish('run',Math.floor(score+coins*30),playRun,false,coins*5)")
          changes.append(f'run pickup payout +5 ({c} finish path)')

          # Racing: physical raceCoinCount remains unchanged; multiply payout only.
          one("finish('racing',Math.floor(score+(clear?10000:0)),playOsoRacing,clear,raceCoinCount)",
              "finish('racing',Math.floor(score+(clear?10000:0)),playOsoRacing,clear,raceCoinCount*10)",
              'racing pickup payout +10')

          # RPG dropped physical coins: convert each amount to x10 bonus, retain drop probabilities/count logic.
          one('fantasyBonusCoins+=amount;','const coinBonus=amount*10;fantasyBonusCoins+=coinBonus;','RPG pickup +10')
          # These two template references occur only inside fantasyCoinDrop.
          aa=s.find('function fantasyCoinDrop(e){');bb=s.find('function win(){',aa)
          if aa<0 or bb<0: raise SystemExit('fantasyCoinDrop scope missing')
          ff=s[aa:bb]
          if ff.count('`🪙 +${amount}`')!=1: raise SystemExit('RPG coin FX amount anchor drift')
          ff=ff.replace('`🪙 +${amount}`','`🪙 +${coinBonus}`',1)
          tail='🪙 +${amount}`);updateHud();return amount'
          if ff.count(tail)!=1: raise SystemExit('RPG coin log/return anchor drift')
          ff=ff.replace(tail,'🪙 +${coinBonus}`);updateHud();return coinBonus',1)
          s=s[:aa]+ff+s[bb:];changes.append('RPG pickup feedback +10')

          # 3) Fail-closed invariants: score/count mechanics must remain untouched.
          invariants=[
            ('coins++;score+=30;','RUN_PHYSICAL_COUNTER_AND_SCORE_UNCHANGED'),
            ('q.got=true;raceCoinCount++;score+=120;','RACING_PHYSICAL_COUNTER_AND_SCORE_UNCHANGED'),
            ('bonus+=120*stageNo','SPACEFIGHTER_SUPER_SCORE_UNCHANGED'),
            ("finish('fantasy',Math.floor(score+18000),playOsoFantasy,true,fantasyBonusCoins)",'RPG_FINAL_CLEAR_CALL_UNCHANGED'),
          ]
          for token,label in invariants:
              if token not in s: raise SystemExit('invariant failed: '+label)

          post=[
            "*2;if(clear)reward+=60; const clearBonus=(clear&&code==='fantasy')?3000:0;",
            'state.coins=beforeCoins+reward+bonusCoins+clearBonus;',
            'rewardTotal=reward+bonusCoins+clearBonus',
            'if(gotCoin)bonusCoins+=10;',
            'bonusCoins+=10;score+=35',
            'bonusCoins+=10;score+=40',
            'playRun,false,coins*5)',
            'playOsoRacing,clear,raceCoinCount*10)',
            'const coinBonus=amount*10;fantasyBonusCoins+=coinBonus;',
            'return coinBonus',
          ]
          missing=[x for x in post if x not in s]
          if missing: raise SystemExit('postconditions failed: '+repr(missing))

          p.write_text(s,encoding='utf-8')
          Path('.github/coin-economy-v2-report.txt').write_text('\n'.join([
            'COIN ECONOMY v2 VERIFIED',
            'GENERIC_CLEAR_MAX=240',
            'RPG_CLEAR_EXTRA=3000',
            'RUN_PICKUP_BONUS=5',
            'OTHER_PICKUP_BONUS=10',
            'BASKET=10','FISH=10','SLICE=10','SPACEFIGHTER=10','RACING=10','FANTASY=10',
            'RUN_PHYSICAL_COUNTER_AND_SCORE_UNCHANGED=YES',
            'RACING_PHYSICAL_COUNTER_AND_SCORE_UNCHANGED=YES',
            'SPACEFIGHTER_SUPER_SCORE_UNCHANGED=YES',
            'CHANGES='+' | '.join(changes),
            'PLAY_SHA256='+hashlib.sha256(s.encode()).hexdigest(),
          ])+'\n',encoding='utf-8')
          PY

          # Full inline JS syntax verification and whitespace diff validation.
          python3 - <<'PY'
          from pathlib import Path
          import re,subprocess,tempfile,os
          s=Path('play/index.html').read_text(encoding='utf-8');n=0
          for body in re.findall(r'<script(?:\s[^>]*)?>(.*?)</script>',s,re.S|re.I):
              if not body.strip():continue
              fd,path=tempfile.mkstemp(suffix='.js');os.close(fd);Path(path).write_text(body,encoding='utf-8')
              r=subprocess.run(['node','--check',path],capture_output=True,text=True);os.unlink(path)
              if r.returncode:raise SystemExit(r.stderr)
              n+=1
          print('INLINE_JS_CHECKED',n)
          PY
          git diff --check
          git config user.name 'PWDJ Coin Economy'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/index.html .github/coin-economy-v2-report.txt
          git commit -m 'Raise game coin rewards and RPG clear bonus'
          git push

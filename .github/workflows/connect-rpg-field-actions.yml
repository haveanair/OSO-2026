name: Connect RPG field actions module
on:
  push:
    paths:
      - '.github/workflows/connect-rpg-field-actions.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Connect separate RPG field actions module
        run: python3 .github/connect_rpg_field_actions.py
      - name: Verify and publish
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'PWDJ RPG Field Actions'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/index.html .github/rpg-field-actions-report.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Enable RPG recovery outside battle'
          git push

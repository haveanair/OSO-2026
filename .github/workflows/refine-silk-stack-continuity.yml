name: Refine silk stack continuity

on:
  push:
    paths:
      - '.github/workflows/refine-silk-stack-continuity.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refine endless stacking flow
        run: python3 .github/refine_silk_stack_continuity.py
      - name: Verify and publish
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'PWDJ Silk Stack'
          git config user.email '34460283+haveanair@users.noreply.github.com'
          git add play/silk-stack-endless.js play/index.html .github/silk-stack-continuity-report.txt
          git diff --cached --quiet && exit 0
          git commit -m 'Refine silk stack altitude continuity'
          git push

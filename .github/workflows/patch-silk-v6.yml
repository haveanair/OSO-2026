name: Restore selection and countdown haptics

on:
  push:
    paths:
      - '.github/workflows/patch-silk-v6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply selection and countdown haptics patch
        run: python .github/scripts/patch-selection-countdown-haptics.py
      - name: Validate inline javascript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          h=Path('play/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',h,re.I|re.S)
          checked=0
          for i,js in enumerate(scripts):
              if not js.strip(): continue
              q=Path(f'/tmp/oso-inline-{i}.js');q.write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check',str(q)],text=True,capture_output=True)
              if r.returncode:
                  print(r.stdout);print(r.stderr);sys.exit(r.returncode)
              checked+=1
          print('inline scripts checked:',checked)
          PY
      - name: Verify targeted haptics policy
        run: |
          grep -F "function selectionHapticElement(target)" play/index.html >/dev/null
          grep -F "buzz([48,12,78])" play/index.html >/dev/null
          grep -F "buzz(v==='3'?26:v==='2'?32:40)" play/index.html >/dev/null
          ! grep -F "hapticsPrimed" play/index.html
          ! grep -F "pendingBrowserBuzz" play/index.html
      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/index.html
          git diff --cached --quiet && exit 0
          git commit -m "선택 햅틱 및 321 GO 카운트다운 진동 복구"
          git push

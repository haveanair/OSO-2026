name: Patch silk stack v6

on:
  push:
    paths:
      - '.github/workflows/patch-silk-v6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply silk stack v6 patch
        run: python .github/scripts/patch-silk-v6.py
      - name: Validate javascript
        run: |
          node --check play/silk-stack-endless.js
          node --check play/character-performance-bonus.js
          node --check play/character-aspect-guard.js
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/silk-stack-endless.js play/character-performance-bonus.js play/index.html
          git diff --cached --quiet && exit 0
          git commit -m "비단쌓기 하트 제한·판정보정·하늘우주 연출 확장"
          git push

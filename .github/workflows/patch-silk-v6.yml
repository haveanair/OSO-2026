name: Apply selection-only haptics

on:
  push:
    paths:
      - '.github/workflows/patch-silk-v6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply selection-only touch haptics patch
        run: python .github/scripts/patch-touch-haptics-selection.py
      - name: Validate external javascript
        run: node --check play/character-performance-bonus.js
      - name: Validate inline javascript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          h=Path('play/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',h,re.I|re.S)
          checked=0
          for i,js in enumerate(scripts):
              if not js.strip(): continue
              q=Path(f'/tmp/oso-inline-{i}.js');q.write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check',str(q)],text=True,capture_output=True)
              if r.returncode:
                  print(r.stdout);print(r.stderr);sys.exit(r.returncode)
              checked+=1
          print('inline scripts checked:',checked)
          PY
      - name: Verify haptic policy markers
        run: |
          ! grep -F "hapticsPrimed" play/index.html
          ! grep -F "pendingBrowserBuzz" play/index.html
          grep -F "전역 화면 터치는 진동시키지 않는다" play/index.html >/dev/null
          grep -F "target.closest('#stage #sseScene')" play/character-performance-bonus.js >/dev/null
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/index.html play/character-performance-bonus.js
          git diff --cached --quiet && exit 0
          git commit -m "전역 터치 진동 제거·선택 동작에만 햅틱 유지"
          git push

name: Patch silk stack endless start height

on:
  push:
    paths:
      - '.github/workflows/patch-silk-v6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Raise endless stack start height
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('play/silk-stack-endless.js')
          s=p.read_text(encoding='utf-8')

          old="""  const W=()=>lane.getBoundingClientRect().width,baseW=Math.min(235,W()*.58);carryWidth=baseW;"""
          new="""  const W=()=>lane.getBoundingClientRect().width,baseW=Math.min(235,W()*.58);carryWidth=baseW;\n  const stackBaseBottom=()=>normal?82:clamp(scene.clientHeight*.77-242,115,210);"""
          if old not in s:
              raise SystemExit('missing base width marker')
          s=s.replace(old,new,1)

          old="""   e.style.width=w+'px';e.style.left=((W()-w)/2)+'px';e.style.bottom='82px';e.innerHTML=silkHTML(total);lane.appendChild(e);return e"""
          new="""   e.style.width=w+'px';e.style.left=((W()-w)/2)+'px';e.style.bottom=stackBaseBottom()+'px';e.innerHTML=silkHTML(total);lane.appendChild(e);return e"""
          if old not in s:
              raise SystemExit('missing base bottom marker')
          s=s.replace(old,new,1)

          old="""   e.style.width=w+'px';e.style.bottom=(135+segment*21-cameraOffset)+'px';e.style.left=x+'px';e.innerHTML=silkHTML(total+1);lane.appendChild(e);return e"""
          new="""   e.style.width=w+'px';e.style.bottom=(stackBaseBottom()+53+segment*21-cameraOffset)+'px';e.style.left=x+'px';e.innerHTML=silkHTML(total+1);lane.appendChild(e);return e"""
          if old not in s:
              raise SystemExit('missing piece bottom marker')
          s=s.replace(old,new,1)

          p.write_text(s,encoding='utf-8')
          PY
      - name: Validate javascript
        run: node --check play/silk-stack-endless.js
      - name: Commit patched file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/silk-stack-endless.js
          git diff --cached --quiet && exit 0
          git commit -m "비단쌓기 엔들리스 10단 천장 높이 조정"
          git push

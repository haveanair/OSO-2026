name: Diagnose global touch haptics

on:
  push:
    paths:
      - '.github/workflows/patch-silk-v6.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Print touch and haptic call sites
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files=[Path('play/index.html')]+list(Path('play').glob('*.js'))
          for p in files:
              if not p.exists(): continue
              s=p.read_text(encoding='utf-8',errors='ignore')
              hits=[]
              for pat in [r'addEventListener\([^\n]{0,180}(?:pointer|touch|click)[^\n]{0,220}',r'\.onclick\s*=.{0,220}',r'\.onpointerdown\s*=.{0,220}',r'\.ontouchstart\s*=.{0,220}',r'buzz\([^\n]{0,140}',r'navigator\.vibrate\([^\n]{0,140}']:
                  for m in re.finditer(pat,s,re.I):
                      a=max(0,m.start()-260); b=min(len(s),m.end()+320)
                      chunk=s[a:b]
                      low=chunk.lower()
                      if ('buzz(' in chunk or 'vibrate' in low) and any(k in low for k in ['pointer','touch','click','onclick']):
                          hits.append((m.start(),chunk))
              if hits:
                  print('\n########',p,'########')
                  seen=[]
                  for pos,chunk in sorted(hits):
                      if any(abs(pos-q)<180 for q in seen): continue
                      seen.append(pos)
                      line=s.count('\n',0,pos)+1
                      print(f'\n--- line {line} pos {pos} ---\n{chunk}\n')
          PY

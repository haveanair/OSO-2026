name: Patch silk stack v6

on:
  push:
    paths:
      - '.github/workflows/patch-silk-v6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply silk stack v6 patch
        shell: python
        run: |
          from pathlib import Path

          def rep(text, old, new, label):
              if old not in text:
                  raise SystemExit(f'missing marker: {label}')
              return text.replace(old, new, 1)

          # --- silk-stack-endless.js ---
          p = Path('play/silk-stack-endless.js')
          s = p.read_text(encoding='utf-8')

          s = rep(s,
          """ function assistProfile(){
  const t=skinTraits(),assisted=!!(t.hamo||t.nongae);
  return {assisted,minOverlap:assisted?20:28,centerScale:assisted?1.30:1}
 }""",
          """ function assistProfile(){
  const t=skinTraits();
  if(t.nongae)return {assisted:true,minOverlap:23,centerScale:1.18};
  if(t.hamo)return {assisted:true,minOverlap:24,centerScale:1.15};
  return {assisted:false,minOverlap:28,centerScale:1}
 }""", 'assist profile')

          s = rep(s,
          ".sseScene{position:absolute;inset:0;overflow:hidden;transition:background .35s}.sseScene .silkLane{z-index:4}.sseScene .silkGround{z-index:3}.sseBackdrop{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;--skyScale:1;--skyDrop:0px;--skyFade:1}",
          ".sseScene{position:absolute;inset:0;overflow:hidden;transition:background .35s}.sseScene .silkLane{z-index:4}.sseScene .silkGround{z-index:3}.sseBackdrop{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1;--skyScale:1;--skyDrop:0px;--skyFade:1;--spaceBlend:0;--atmoFade:1}", 'backdrop vars')

          s = rep(s,
          ".sseScene.sse-sky .silkGround{background:linear-gradient(#d8f3ff,#8fd2ee);box-shadow:inset 0 8px #fff8;opacity:var(--skyFade);transition:opacity .35s}.sseScene.sse-space .silkGround{background:linear-gradient(#25284f,#10152f);box-shadow:inset 0 8px #7682bd}",
          ".sseScene.sse-sky .silkGround{background:linear-gradient(#d8f3ff,#8fd2ee);box-shadow:inset 0 8px #fff8;opacity:var(--skyFade);transition:opacity .35s}.sseScene.sse-space .silkGround{background:linear-gradient(#25284f,#10152f);box-shadow:inset 0 8px #7682bd}.sseSkySpaceVeil{position:absolute;inset:0;z-index:7;background:linear-gradient(#050817 0%,#101333 44%,#25395d 72%,#557b98 100%);opacity:var(--spaceBlend);transition:opacity .32s;pointer-events:none}.sseSkyStars{position:absolute;inset:0;z-index:8;background-image:radial-gradient(#fff 1.1px,transparent 1.3px),radial-gradient(#9edcff 1px,transparent 1.2px),radial-gradient(#ffe6a0 1px,transparent 1.2px);background-size:43px 43px,67px 67px,91px 91px;background-position:0 0,19px 11px,37px 29px;opacity:var(--spaceBlend);transition:opacity .32s;pointer-events:none}", 'sky space veil')

          old_fly = ".sseCloud{position:absolute;width:100px;height:30px;border-radius:999px;background:#fffde8;filter:drop-shadow(0 3px 2px #5b9dbb55);animation:sseFly 10s linear infinite}.sseCloud:before,.sseCloud:after{content:'';position:absolute;border-radius:50%;background:inherit}.sseCloud:before{width:46px;height:46px;left:16px;top:-23px}.sseCloud:after{width:54px;height:54px;right:10px;top:-29px}.sseCloud.c1{top:18%;left:-130px}.sseCloud.c2{top:43%;left:-190px;animation-duration:14s;animation-delay:-7s;transform:scale(.75)}.sseBird{position:absolute;left:-60px;font-size:24px;animation:sseFly 8s linear infinite}.sseBird.b1{top:35%;animation-delay:-2s}.sseBird.b2{top:22%;animation-duration:11s;animation-delay:-7s}.ssePlane{position:absolute;left:-120px;top:16%;font-size:42px;animation:sseFly 7s linear infinite;opacity:0;transition:opacity .6s}.sseScene.sse-sky.sse-high .ssePlane{opacity:1}@keyframes sseFly{to{left:calc(100% + 140px)}}"
          new_fly = ".sseCloud{position:absolute;width:100px;height:30px;border-radius:999px;background:#fffde8;filter:drop-shadow(0 3px 2px #5b9dbb55);animation:sseFly 10s linear infinite;opacity:var(--atmoFade)}.sseCloud:before,.sseCloud:after{content:'';position:absolute;border-radius:50%;background:inherit}.sseCloud:before{width:46px;height:46px;left:16px;top:-23px}.sseCloud:after{width:54px;height:54px;right:10px;top:-29px}.sseCloud.c1{top:18%;left:-130px}.sseCloud.c2{top:43%;left:-190px;animation-duration:14s;animation-delay:-7s;transform:scale(.75)}.sseBird{position:absolute;left:-60px;font-size:24px;animation:sseFly 8s linear infinite;transform:scaleX(-1);opacity:var(--atmoFade);transition:opacity .3s}.sseBird.b1{top:35%;animation-delay:-2s}.sseBird.b2{top:22%;animation-duration:11s;animation-delay:-7s}.ssePlane{position:absolute;left:-120px;top:16%;font-size:42px;animation:sseFly 7s linear infinite;transform:rotate(45deg);transform-origin:center;opacity:0;transition:opacity .6s}.sseScene.sse-sky.sse-high .ssePlane{opacity:var(--atmoFade)}@keyframes sseFly{to{left:calc(100% + 140px)}}"
          s = rep(s, old_fly, new_fly, 'bird and plane')

          s = rep(s,
          ".sseStation i{position:absolute;left:46px;top:-14px;width:20px;height:56px;border-radius:10px;background:#f2f5fb}.sseAstronaut{position:absolute;left:-80px;top:38%;font-size:38px;animation:sseAstronaut 13s ease-in-out infinite;animation-delay:var(--d,0s);opacity:0}@keyframes sseAstronaut{0%,18%{opacity:0;transform:translate(0,0) rotate(-18deg)}28%,72%{opacity:1}82%,100%{opacity:0;transform:translate(calc(100vw + 150px),-90px) rotate(32deg)}}",
          ".sseStation i{position:absolute;left:46px;top:-14px;width:20px;height:56px;border-radius:10px;background:#f2f5fb}.sseAstronaut{position:absolute;left:-80px;top:38%;font-size:38px;animation:sseAstronaut 13s ease-in-out infinite;animation-delay:var(--d,0s);opacity:0}@keyframes sseAstronaut{0%,18%{opacity:0;transform:translate(0,0) rotate(-18deg)}28%,72%{opacity:1}82%,100%{opacity:0;transform:translate(calc(100vw + 150px),-90px) rotate(32deg)}}.sseUfo{position:absolute;z-index:12;font-size:48px;filter:drop-shadow(0 0 10px #8cf);pointer-events:none}.sseUfo.u1{left:-110px;top:27%;animation:sseUfoFly 8.5s linear infinite}.sseUfo.u2{right:-120px;top:61%;font-size:39px;animation:sseUfoBack 11s linear infinite;animation-delay:-4s}@keyframes sseUfoFly{0%{transform:translateX(0) translateY(0) rotate(-8deg)}45%{transform:translateX(55vw) translateY(35px) rotate(6deg)}100%{transform:translateX(calc(100vw + 240px)) translateY(-45px) rotate(-4deg)}}@keyframes sseUfoBack{0%{transform:translateX(0) translateY(0) rotate(7deg)}50%{transform:translateX(-58vw) translateY(-42px) rotate(-5deg)}100%{transform:translateX(calc(-100vw - 250px)) translateY(34px) rotate(5deg)}}",
          'ufo css')

          s = rep(s,
          ".ssePerfectGrow{animation:ssePerfectGrow .42s ease-out}@keyframes ssePerfectGrow{0%{filter:brightness(1.5);transform:scaleX(1.03)}100%{filter:none;transform:scaleX(1)}}",
          ".ssePerfectGrow{animation:ssePerfectGrow .42s ease-out}@keyframes ssePerfectGrow{0%{filter:brightness(1.5);transform:scaleX(1.03)}100%{filter:none;transform:scaleX(1)}}.sseGrandFinale{position:absolute;left:50%;top:43%;z-index:72;transform:translate(-50%,-50%);width:min(360px,calc(100% - 28px));padding:18px 16px;border:5px solid #fff4a5;border-radius:24px;background:#141631e8;color:#fff;text-align:center;font-size:clamp(24px,7vw,38px);font-weight:1000;line-height:1.05;text-shadow:0 0 12px #fff,0 0 25px #ffd54b,0 4px #7f2d78;box-shadow:0 0 30px #fff8,0 0 70px #ffcf4f99;pointer-events:none;animation:sseGrandFinale 2.35s ease-out forwards}.sseGrandFinale.space{background:#080b24ed;border-color:#aee9ff;box-shadow:0 0 30px #bff,0 0 80px #806cffaa}.sseGrandFinale small{display:block;margin-top:8px;font-size:12px;line-height:1.3;color:#fff6c8;text-shadow:none}@keyframes sseGrandFinale{0%{opacity:0;transform:translate(-50%,-50%) scale(.35)}15%{opacity:1;transform:translate(-50%,-50%) scale(1.18)}35%,78%{opacity:1;transform:translate(-50%,-50%) scale(1)}100%{opacity:0;transform:translate(-50%,-70%) scale(1.08)}}",
          'grand finale css')

          old_backdrop = """ function backdropHTML(st){
  if(st.zone==='house')return `<div class=\"sseHouseWall\"></div><div class=\"sseHouseWindow l\"></div><div class=\"sseHouseWindow r\"></div><div class=\"sseCeiling\"></div>`;
  if(st.zone==='building')return `<div class=\"sseBuildingWall\"></div><div class=\"sseWindowGrid\"></div><div class=\"sseFloorBand\"></div>`;
  if(st.zone==='sky')return `<div class=\"sseMountainFar\"></div><div class=\"sseMountainNear\"></div><div class=\"sseBrokenBuilding\"></div><div class=\"sseCloud c1\"></div><div class=\"sseCloud c2\"></div><div class=\"sseBird b1\">🐦</div><div class=\"sseBird b2\">🐦</div><div class=\"ssePlane\">✈️</div>`;
  return `<div class=\"sseStars\"></div><div class=\"sseRocket\">🚀</div><div class=\"sseMeteor m1\"></div><div class=\"sseMeteor m2\"></div><div class=\"sseStation\"><i></i></div><div class=\"sseAstronaut\" style=\"--d:-2s\">🧑‍🚀</div><div class=\"sseAstronaut\" style=\"--d:-9s;top:58%;font-size:31px\">🧑‍🚀</div>`
 }"""
          new_backdrop = """ function backdropHTML(st){
  if(st.zone==='house')return `<div class=\"sseHouseWall\"></div><div class=\"sseHouseWindow l\"></div><div class=\"sseHouseWindow r\"></div><div class=\"sseCeiling\"></div>`;
  if(st.zone==='building')return `<div class=\"sseBuildingWall\"></div><div class=\"sseWindowGrid\"></div><div class=\"sseFloorBand\"></div>`;
  if(st.zone==='sky')return `<div class=\"sseMountainFar\"></div><div class=\"sseMountainNear\"></div><div class=\"sseBrokenBuilding\"></div><div class=\"sseCloud c1\"></div><div class=\"sseCloud c2\"></div><div class=\"sseBird b1\">🐦</div><div class=\"sseBird b2\">🐦</div><div class=\"ssePlane\">✈️</div><div class=\"sseSkySpaceVeil\"></div><div class=\"sseSkyStars\"></div>`;
  const deep=st.floor>=4;
  return `<div class=\"sseStars\"></div><div class=\"sseRocket\">🚀</div><div class=\"sseMeteor m1\"></div><div class=\"sseMeteor m2\"></div><div class=\"sseStation\"><i></i></div>${deep?`<div class=\"sseAstronaut\" style=\"--d:-2s\">🧑‍🚀</div><div class=\"sseAstronaut\" style=\"--d:-9s;top:58%;font-size:31px\">🧑‍🚀</div><div class=\"sseAstronaut\" style=\"--d:-5s;top:73%;font-size:27px\">🧑‍🚀</div><div class=\"sseUfo u1\">🛸</div><div class=\"sseUfo u2\">🛸</div>`:''}`
 }"""
          s = rep(s, old_backdrop, new_backdrop, 'backdrop html')

          old_scene = """  function setScene(force=false){
   const step=normal?NORMAL_FLOORS:ENDLESS_BREAK,st=stageFor(total,step),continuous=st.zone==='sky'||st.zone==='space',key=continuous?st.zone:st.zone+':'+st.floor,high=st.zone==='sky'&&st.floor>=5;
   scene.className=`silkScene sseScene sse-${st.zone}${high?' sse-high':''}`;
   if(force||key!==lastStageKey){back.innerHTML=backdropHTML(st);lastStageKey=key}
   if(st.zone==='sky'){const p=clamp((total-step*5)/(step*10),0,1);back.style.setProperty('--skyScale',(1-p*.58).toFixed(3));back.style.setProperty('--skyDrop',Math.round(p*88)+'px');back.style.setProperty('--skyFade',Math.max(.08,1-p*.88).toFixed(3))}
   else{back.style.setProperty('--skyScale','1');back.style.setProperty('--skyDrop','0px');back.style.setProperty('--skyFade','1')}
   const h=s.querySelector('#sseFloorHud');if(!h)return;
   h.classList.toggle('space',st.zone==='space');
   h.innerHTML=normal?`${total} / 15 단`:`<span class=\"sseEndlessTag\">ENDLESS</span>${st.label} · ${total}단`
  }"""
          new_scene = """  function setScene(force=false){
   const step=normal?NORMAL_FLOORS:ENDLESS_BREAK,st=stageFor(total,step),continuous=st.zone==='sky'||st.zone==='space',deepSpace=st.zone==='space'&&st.floor>=4,key=st.zone==='space'?st.zone+':'+(deepSpace?'deep':'near'):continuous?st.zone:st.zone+':'+st.floor,high=st.zone==='sky'&&st.floor>=5;
   scene.className=`silkScene sseScene sse-${st.zone}${high?' sse-high':''}`;
   if(force||key!==lastStageKey){back.innerHTML=backdropHTML(st);lastStageKey=key}
   if(st.zone==='sky'){
    const p=clamp((total-step*5)/(step*10),0,1),blend=clamp((p-.45)/.55,0,1),atmo=1-blend;
    back.style.setProperty('--skyScale',(1-p*.58).toFixed(3));back.style.setProperty('--skyDrop',Math.round(p*88)+'px');back.style.setProperty('--skyFade',Math.max(.05,1-p*.92).toFixed(3));back.style.setProperty('--spaceBlend',blend.toFixed(3));back.style.setProperty('--atmoFade',atmo.toFixed(3))
   }
   else{back.style.setProperty('--skyScale','1');back.style.setProperty('--skyDrop','0px');back.style.setProperty('--skyFade','1');back.style.setProperty('--spaceBlend','0');back.style.setProperty('--atmoFade','1')}
   const h=s.querySelector('#sseFloorHud');if(!h)return;
   h.classList.toggle('space',st.zone==='space');
   h.innerHTML=normal?`${total} / 15 단`:`<span class=\"sseEndlessTag\">ENDLESS</span>${st.label} · ${total}단`
  }"""
          s = rep(s, old_scene, new_scene, 'setScene')

          s = rep(s,
          "const lh=s.querySelector('#stackLife');if(lh)lh.textContent='❤️'.repeat(lives)+'🖤'.repeat(Math.max(0,3-lives));",
          "const lh=s.querySelector('#stackLife');if(lh)lh.textContent=lives>=6?`❤️ ×${Math.min(lives,10)}`:'❤️'.repeat(lives)+'🖤'.repeat(Math.max(0,3-lives));",
          'life hud')

          s = rep(s,
          "if(isPerfect){grow=expandPerfectPiece(current);perfectCount++;if(perfectCount>=3){perfectCount=0;lives++;heartBonus=true}}",
          "if(isPerfect){grow=expandPerfectPiece(current);perfectCount++;if(perfectCount>=3){perfectCount=0;if(lives<10){lives++;heartBonus=true}}}",
          'heart cap')

          grand_fn = r'''  function grandFinale(zone){
   const isSpace=zone==='space',fx=document.createElement('div');
   fx.className='sseGrandFinale'+(isSpace?' space':'');
   fx.innerHTML=isSpace?'🌌 우주 대기록!<small>별 너머까지 도달했습니다!</small>':'🎆 하늘 대기록!<small>구름 위까지 쌓아 올렸습니다!</small>';
   scene.appendChild(fx);setTimeout(()=>fx.remove(),2450);
   try{
    const r=scene.getBoundingClientRect(),emoji=isSpace?'🌠':'🎆';
    [[.22,.42],[.5,.34],[.78,.45],[.36,.58],[.66,.6]].forEach(([px,py],i)=>setTimeout(()=>particles(r.left+r.width*px,r.top+r.height*py,emoji,isSpace?18:15),i*130));
    const notes=[523,659,784,1047,784,1047,1319,1568];
    notes.forEach((hz,i)=>setTimeout(()=>beep(hz,.12,.032,i%2?'triangle':'square',hz*1.015),i*125));
    setTimeout(()=>{beep(1047,.5,.045,'square',1047);beep(1319,.52,.036,'triangle',1319);beep(1568,.55,.03,'sine',1568)},1080);
    setTimeout(()=>{beep(1319,.22,.028,'square',1319);beep(1760,.32,.024,'triangle',1760)},1700);
    tone('clear');buzz([45,20,70,20,95,25,130,30,180,35,260])
   }catch(_){}
  }
'''
          marker = "  function gameOver(){\n"
          if marker not in s:
              raise SystemExit('missing marker: gameOver insert')
          s = s.replace(marker, grand_fn + marker, 1)

          old_gameover = """  function gameOver(){
   alive=false;paused=false;cancelAnimationFrame(raf);showFinalFlag();try{showComboBurst('GAME OVER',3,'multi');tone('clear');buzz([20,8,34,8,52])}catch(_){}
   setTimeout(()=>finish('stack',score,showModeSelect,false),980)
  }"""
          new_gameover = """  function gameOver(){
   alive=false;paused=false;cancelAnimationFrame(raf);showFinalFlag();
   const st=stageFor(total,ENDLESS_BREAK),grand=!normal&&(st.zone==='sky'||st.zone==='space');
   if(grand){grandFinale(st.zone);setTimeout(()=>finish('stack',score,showModeSelect,false),2700);return}
   try{showComboBurst('GAME OVER',3,'multi');tone('clear');buzz([20,8,34,8,52])}catch(_){}
   setTimeout(()=>finish('stack',score,showModeSelect,false),980)
  }"""
          s = rep(s, old_gameover, new_gameover, 'game over finale')

          p.write_text(s, encoding='utf-8')

          # --- character-performance-bonus.js ---
          p = Path('play/character-performance-bonus.js')
          s = p.read_text(encoding='utf-8')

          s = rep(s,
          "if(t.nongae)return {on:true,nongae:true,strength:.92,maxShift:56,label:'✨ 논개 강력 비단 판정보정 ON'};",
          "if(t.nongae)return {on:true,nongae:true,strength:.52,maxShift:24,label:'✨ 논개 비단 판정보정 ON'};",
          'nongae assist')
          s = rep(s,
          "if(t.hamo)return {on:true,nongae:false,strength:.84,maxShift:46,label:'🎯 하모 강력 비단 판정보정 ON'};",
          "if(t.hamo)return {on:true,nongae:false,strength:.46,maxShift:20,label:'🎯 하모 비단 판정보정 ON'};",
          'hamo assist')

          great_css = """      #stage .sseGreatBurst2{position:absolute!important;left:50%!important;top:37%!important;z-index:51!important;transform:translateX(-50%) scale(.74)!important;width:auto!important;min-width:min(210px,calc(100% - 28px))!important;max-width:calc(100% - 28px)!important;box-sizing:border-box!important;padding:9px 14px 8px!important;border:4px solid #35704a!important;border-radius:17px!important;background:#efffcdf2!important;color:#27513a!important;text-align:center!important;box-shadow:0 7px 0 #4f855d,0 13px 24px #0004!important;pointer-events:none!important;opacity:0!important;animation:sseGreatBurst2 .98s cubic-bezier(.18,.78,.22,1) forwards!important}
      #stage .sseGreatBurst2 .sseGreatMain{display:block!important;font-size:clamp(20px,5.8vw,28px)!important;font-weight:1000!important;line-height:1.02!important;white-space:nowrap!important}
      #stage .sseGreatBurst2 .sseGreatSub{display:block!important;margin-top:5px!important;font-size:clamp(11px,3.2vw,14px)!important;font-weight:1000!important;line-height:1.15!important;white-space:normal!important;word-break:keep-all!important}
      @keyframes sseGreatBurst2{0%{opacity:0;transform:translateX(-50%) scale(.68)}20%{opacity:1;transform:translateX(-50%) scale(1.08)}48%,78%{opacity:1;transform:translateX(-50%) scale(1)}100%{opacity:0;transform:translateX(-50%) translateY(-18px) scale(.94)}}

"""
          marker = "      #stage .ssePerfectBurst2{"
          if marker not in s:
              raise SystemExit('missing marker: perfect css')
          s = s.replace(marker, great_css + marker, 1)

          great_fn = r'''  function showStackGreatBurst(message){
    try{
      const scene=document.querySelector('#stage #sseScene');if(!scene)return false;
      const msg=String(message||'').trim();if(!/^GREAT!/.test(msg))return false;
      scene.querySelectorAll('.sseGreatBurst2').forEach(e=>e.remove());
      const parts=msg.split(' · ').map(s=>s.trim()).filter(Boolean),main=parts.shift()||'GREAT!',sub=parts.join(' · ');
      const box=document.createElement('div');box.className='sseGreatBurst2';
      const a=document.createElement('span');a.className='sseGreatMain';a.textContent=main;
      const b=document.createElement('span');b.className='sseGreatSub';b.textContent=sub||'비단 폭 회복!';
      box.append(a,b);scene.appendChild(box);setTimeout(()=>box.remove(),1040);return true
    }catch(_){return false}
  }
'''
          marker = "  function showStackPerfectBurst(message){\n"
          if marker not in s:
              raise SystemExit('missing marker: perfect function')
          s = s.replace(marker, great_fn + marker, 1)

          s = rep(s,
          "if(stack&&/^GREAT!/.test(msg)){const gain=expandLatestStackPiece(.04,5,8);msg=rewriteGrowMessage(msg,gain);arguments[0]=msg}",
          "if(stack&&/^GREAT!/.test(msg)){const gain=expandLatestStackPiece(.04,5,8);msg=rewriteGrowMessage(msg,gain);ensureStyle();if(showStackGreatBurst(msg))return;arguments[0]=msg}",
          'great two line hook')

          s = rep(s,
          "'일시정지·모바일 HUD·PERFECT 2줄 이펙트·구조물 격파 연출 강화']}",
          "'일시정지·모바일 HUD·GREAT/PERFECT 2줄 이펙트·구조물 격파 연출 강화','하늘→우주 자연 전환, 고고도 종료 빵빠레, 심우주 우주인·UFO 연출 추가']}",
          'news entry')

          p.write_text(s, encoding='utf-8')

          # --- cache bust script urls ---
          p = Path('play/index.html')
          s = p.read_text(encoding='utf-8')
          for old,new,label in [
              ('./character-aspect-guard.js?v=20260907-aspect1','./character-aspect-guard.js?v=20260907-aspect2','aspect cache'),
              ('./silk-stack-endless.js?v=20260907-endless3','./silk-stack-endless.js?v=20260907-endless6','silk cache'),
              ('./character-performance-bonus.js?v=20260907-charbonus3','./character-performance-bonus.js?v=20260907-charbonus6','bonus cache'),
          ]:
              s = rep(s, old, new, label)
          p.write_text(s, encoding='utf-8')

      - name: Validate javascript
        run: |
          node --check play/silk-stack-endless.js
          node --check play/character-performance-bonus.js
          node --check play/character-aspect-guard.js
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"

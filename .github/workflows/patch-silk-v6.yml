name: Diagnose KF21 bombing

on:
  push:
    paths:
      - '.github/workflows/patch-silk-v6.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Print KF21 bombing source windows
        run: |
          python - <<'PY'
          from pathlib import Path
          s=Path('play/index.html').read_text(encoding='utf-8')
          needles=['kf21','KF-21','superFx.kind','bombs','폭격']
          seen=[]
          for needle in needles:
              start=0
              while True:
                  i=s.find(needle,start)
                  if i<0: break
                  if not any(abs(i-x)<800 for x in seen):
                      seen.append(i)
                      a=max(0,i-1800); b=min(len(s),i+4200)
                      print('\n===== NEEDLE',needle,'AT',i,'=====\n')
                      print(s[a:b])
                  start=i+len(needle)
          print('\nTOTAL WINDOWS',len(seen))
          PY

name: Patch stack judgement and KF21 haptics v2.1

on:
  push:
    paths:
      - '.github/workflows/patch-silk-v6.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python .github/scripts/patch-stack-kf21-v2.py
      - name: Validate external javascript
        run: node --check play/character-performance-bonus.js
      - name: Validate inline javascript
        run: |
          python - <<'PY'
          from pathlib import Path
          import re, subprocess, sys
          h=Path('play/index.html').read_text(encoding='utf-8')
          scripts=re.findall(r'<script(?![^>]*\bsrc=)[^>]*>(.*?)</script>',h,re.I|re.S)
          checked=0
          for i,js in enumerate(scripts):
              if not js.strip():
                  continue
              q=Path(f'/tmp/oso-inline-{i}.js')
              q.write_text(js,encoding='utf-8')
              r=subprocess.run(['node','--check',str(q)],text=True,capture_output=True)
              if r.returncode:
                  print(r.stdout)
                  print(r.stderr)
                  sys.exit(r.returncode)
              checked+=1
          print('inline scripts checked:',checked)
          PY
      - name: Verify patched markers
        run: |
          grep -F "sseJudgeBurst2" play/character-performance-bonus.js >/dev/null
          grep -F "kfVibeMask" play/index.html >/dev/null
          grep -F "charbonus6" play/index.html >/dev/null
      - name: Commit patched files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add play/character-performance-bonus.js play/index.html
          git diff --cached --quiet && exit 0
          git commit -m "비단 판정 출력 안정화·KF21 폭격 진동 동기화"
          git push

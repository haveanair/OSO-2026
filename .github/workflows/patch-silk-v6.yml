name: Diagnose selection and countdown haptics

on:
  push:
    paths:
      - '.github/workflows/patch-silk-v6.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Print selection and countdown paths
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          p=Path('play/index.html')
          s=p.read_text(encoding='utf-8',errors='ignore')
          pats=['readyThen','321','3·2·1','GO!','countdown','data-game','gameCard','menuBtn','titleMenu','onclick','addEventListener']
          shown=[]
          for pat in pats:
              print('\n===== PATTERN',pat,'=====')
              for m in list(re.finditer(re.escape(pat),s,re.I))[:30]:
                  pos=m.start()
                  if any(abs(pos-x)<350 for x in shown): continue
                  shown.append(pos)
                  line=s.count('\n',0,pos)+1
                  a=max(0,pos-650); b=min(len(s),pos+1100)
                  print(f'\n--- line {line} pos {pos} ---\n{s[a:b]}\n')
          PY

 }

/* ===== common mobile-game long-press protection ===== */

  -webkit-user-drag:none!important;

  display:none!important;

/* ===== v3.2 SOTRIS MEGA EFFECT ===== */
.comboText.sotrisMega{
  top:44%!important;
  font-size:clamp(70px,15vw,168px)!important;
  -webkit-text-stroke:3px #fff!important;
  text-shadow:
    0 9px 0 #111,
    0 0 28px #fff,
    0 0 58px #55d7f5,
    0 0 95px #ff6f87!important;
}
.comboText.sotrisMega.show{
  animation:sotrisMegaPop 1.72s cubic-bezier(.12,.75,.08,1) forwards!important;
}
@keyframes sotrisMegaPop{
  0%{opacity:0;transform:translate(-50%,-50%) scale(.12) rotate(-18deg)}
  14%{opacity:1;transform:translate(-50%,-50%) scale(1.48) rotate(7deg)}
  31%{opacity:1;transform:translate(-50%,-50%) scale(1.10) rotate(-3deg)}
  58%{opacity:1;transform:translate(-50%,-50%) scale(1.30) rotate(2deg)}
  78%{opacity:1;transform:translate(-50%,-53%) scale(1.17)}
  100%{opacity:0;transform:translate(-50%,-78%) scale(1.42)}
}
.spark.megaSpark{
  width:15px!important;
  height:15px!important;
  box-shadow:0 0 13px currentColor,0 0 24px currentColor;
  animation-duration:1.62s!important;
}
.centerRing.megaRing{
  width:48px!important;
  height:48px!important;
  border-width:7px!important;
  animation:megaCenterRing 1.55s ease-out forwards!important;
}
@keyframes megaCenterRing{
  0%{opacity:1;transform:translate(-50%,-50%) scale(.08)}
  52%{opacity:.9}
  100%{opacity:0;transform:translate(-50%,-50%) scale(13)}
}
.centerStar.megaStar{
  width:27px!important;
  height:27px!important;
  filter:drop-shadow(0 0 8px currentColor);
  animation-duration:1.55s!important;
}
.flash.mega{
  animation:sotrisMegaFlash .90s ease-out forwards!important;
}
@keyframes sotrisMegaFlash{
  0%{opacity:.82}
  13%{opacity:.16}
  28%{opacity:.66}
  46%{opacity:.12}
  62%{opacity:.42}
  100%{opacity:0}
}
.boardWrap.sotrisShake{
  animation:sotrisBoardShake 1.12s linear!important;
}
@keyframes sotrisBoardShake{
  0%,100%{transform:translate(0,0)}
  8%{transform:translate(-9px,4px)}
  16%{transform:translate(10px,-5px)}
  25%{transform:translate(-8px,-3px)}
  34%{transform:translate(8px,5px)}
  44%{transform:translate(-6px,2px)}
  55%{transform:translate(6px,-3px)}
  68%{transform:translate(-4px,2px)}
  82%{transform:translate(3px,-1px)}
}

/* ===== v3.5 20-drop cascade gauge ===== */
.cascadeGaugeCard{
  grid-column:1/-1!important;
  padding:5px 6px!important;
}
.cascadeGaugeHead{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:5px;
  margin-bottom:4px;
}
.cascadeGaugeHead b{
  margin:0!important;
  font-size:8px!important;
  color:#aebbe0!important;
}
.cascadeGaugeHead strong{
  font-size:9px!important;
  color:#dbe8ff;
}
.cascadeGauge{
  display:grid;
  grid-template-columns:repeat(20,1fr);
  gap:2px;
  height:9px;
}
.cascadeGauge i{
  display:block;
  min-width:0;
  border-radius:3px;
  background:#263858;
  border:1px solid #405677;
  box-shadow:inset 0 -2px 0 #13233b;
}
.cascadeGauge i.on{
  background:linear-gradient(#ffe56d,#ff9e40);
  border-color:#fff0a8;
  box-shadow:0 0 5px #ffc35c99,inset 0 -2px 0 #ce6633;
}
.cascadeGaugeCard.full{
  border-color:#ffd85f!important;
  box-shadow:0 0 10px #ffd85f66;
  animation:gaugeReadyPulse .72s ease-in-out infinite alternate;
}
.cascadeGaugeCard.full .cascadeGaugeHead strong{
  color:#ffe978;
  text-shadow:0 0 7px #ffb64d;
}
@keyframes gaugeReadyPulse{
  from{filter:brightness(1)}
  to{filter:brightness(1.24)}
}

<script>(()=>{'use strict';
/* SP1 SOTRIS LIVE v3.8-webslim */

/* ===== JCM SP1 BRIDGE : isolated iframe integration ===== */
const SP1_EMBEDDED = window.parent !== window;
const SP1_BRIDGE_SESSION = 'sp1-' + Date.now().toString(36) + '-' + Math.random().toString(36).slice(2,8);
let SP1_BRIDGE_ATTEMPT = 0;
let SP1_BRIDGE_RESULT_SENT = false;

function sp1BridgePost(type, payload={}){
 if(!SP1_EMBEDDED)return;
 try{
  window.parent.postMessage({
   source:'sotris-sp1',
   type,
   session:SP1_BRIDGE_SESSION,
   attempt:SP1_BRIDGE_ATTEMPT,
   ...payload
  }, '*')
 }catch(_){}
}
function sp1BridgeBeginAttempt(){
 SP1_BRIDGE_ATTEMPT++;
 SP1_BRIDGE_RESULT_SENT=false;
 const go=document.querySelector('#sp1GameOverReward');
 const en=document.querySelector('#sp1EndingReward');
 if(go)go.textContent='';
 if(en)en.textContent=''
}
function sp1BridgeResult(clear){
 if(!SP1_EMBEDDED || SP1_BRIDGE_RESULT_SENT)return;
 SP1_BRIDGE_RESULT_SENT=true;
 sp1BridgePost('RESULT',{
  clear:!!clear,
  score:Math.max(0,Math.floor(Number(score)||0)),
  stage:Math.max(1,Math.min(5,(Number(stage)||0)+1))
 })
}
function sp1BridgeExit(){
 if(SP1_EMBEDDED)sp1BridgePost('EXIT');
 else showTitle()
}
function sp1BridgeInstallUi(){
 if(!SP1_EMBEDDED)return;
 const gameOver=document.querySelector('#gameOver .pop');
 if(gameOver && !document.querySelector('#sp1GameOverReward')){
  const p=document.createElement('p');
  p.id='sp1GameOverReward';
  p.className='sp1BridgeReward';
  gameOver.insertBefore(p, gameOver.querySelector('#retry'));
  const b=document.createElement('button');
  b.id='sp1ExitFromGameOver';
  b.textContent='게임장으로';
  b.style.marginLeft='7px';
  gameOver.appendChild(b);
  b.onclick=sp1BridgeExit
 }
 const endingCard=document.querySelector('#ending .endingCard');
 if(endingCard && !document.querySelector('#sp1EndingReward')){
  const p=document.createElement('div');
  p.id='sp1EndingReward';
  p.className='sp1BridgeReward';
  const btn=document.querySelector('#endToTitle');
  endingCard.insertBefore(p,btn);
  if(btn)btn.textContent='게임장으로'
 }
 const style=document.createElement('style');
 style.textContent=`
  .sp1BridgeReward{min-height:24px;margin:8px 0;color:#ffe36d;font-weight:1000;
   text-shadow:0 2px 0 #000;font-size:13px}
  #gameOver .pop button{margin-top:7px}
 `;
 document.head.appendChild(style)
}
window.addEventListener('message',e=>{
 const d=e.data||{};
 if(!SP1_EMBEDDED || e.source!==window.parent || d.source!=='jcm-main')return;
 if(d.type==='SP1_REWARD' && d.session===SP1_BRIDGE_SESSION && d.attempt===SP1_BRIDGE_ATTEMPT){
  const bonusPart=d.specialBonus?` · SP보너스 ${Number(d.specialBonus).toLocaleString()} 코인`:'';

function initAudio(){if(!ac)ac=new (window.AudioContext||window.webkitAudioContext)()}
function tone(f,dur=.14,type='sine',vol=.018,delay=0){if(!ac||!f)return;const t=ac.currentTime+delay,o=ac.createOscillator(),g=ac.createGain();o.type=type;o.frequency.setValueAtTime(f,t);g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+dur);o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+dur+.02)}
function impact(strong=false){
 initAudio();
 if(!ac)return;
 try{if(ac.state==='suspended')ac.resume()}catch(e){}
 const now=ac.currentTime;

 // 1) Deep body thump
 const o=ac.createOscillator(),g=ac.createGain();
 o.type='sine';
 o.frequency.setValueAtTime(strong?215:185,now);
 o.frequency.exponentialRampToValueAtTime(strong?34:40,now+.21);
 g.gain.setValueAtTime(.0001,now);
 g.gain.exponentialRampToValueAtTime(strong?.42:.34,now+.004);
 g.gain.exponentialRampToValueAtTime(.0001,now+.22);
 o.connect(g);g.connect(ac.destination);
 o.start(now);o.stop(now+.24);

 // 2) Heavy block body
 const b=ac.createOscillator(),bg=ac.createGain();
 b.type='square';
 b.frequency.setValueAtTime(strong?110:92,now);
 b.frequency.exponentialRampToValueAtTime(strong?68:60,now+.085);
 bg.gain.setValueAtTime(strong?.22:.18,now);
 bg.gain.exponentialRampToValueAtTime(.0001,now+.10);
 b.connect(bg);bg.connect(ac.destination);
 b.start(now);b.stop(now+.11);

 // 3) Contact click
 const c=ac.createOscillator(),cg=ac.createGain();
 c.type='square';
 c.frequency.setValueAtTime(strong?980:780,now);
 c.frequency.exponentialRampToValueAtTime(strong?250:220,now+.042);
 cg.gain.setValueAtTime(strong?.16:.13,now);
 cg.gain.exponentialRampToValueAtTime(.0001,now+.048);
 c.connect(cg);cg.connect(ac.destination);
 c.start(now);c.stop(now+.052);

 // 4) Short impact noise
 try{
  const len=Math.floor(ac.sampleRate*.07);
  const buf=ac.createBuffer(1,len,ac.sampleRate);
  const data=buf.getChannelData(0);
  for(let i=0;i<len;i++){
    const env=Math.pow(1-i/len,2);
    data[i]=(Math.random()*2-1)*env;
  }
  const ns=ac.createBufferSource(),f=ac.createBiquadFilter(),ng=ac.createGain();
  ns.buffer=buf;
  f.type='lowpass';
  f.frequency.setValueAtTime(strong?1900:1450,now);
  ng.gain.setValueAtTime(strong?.40:.32,now);
  ng.gain.exponentialRampToValueAtTime(.0001,now+.07);
  ns.connect(f);f.connect(ng);ng.connect(ac.destination);
  ns.start(now);
 }catch(e){}
}
function note(name,kind='square',vol=.017){if(!name)return;const f=freq(name);tone(f,.16,kind,vol);if(kind==='square')tone(f*2,.07,'square',Math.max(.0035,vol*.20),.008)}

  }

function stopMusic(){if(musicTimer){clearInterval(musicTimer);musicTimer=null}}
function startSong(key){
 if(!audioUnlocked)return;
 stopMusic();
 musicStep=0;
 const s=SONGS[key],
       leadVol=(s.vol??.018)*BGM_MASTER,
       bassVol=(s.bassVol??.009)*BGM_MASTER;
 const tick=()=>{
  if(key==='title'){
   if(!$('#title').classList.contains('on'))return
  }else if(!running||paused||clearing||lineFxActive)return;
  const i=musicStep%s.lead.length;
  note(s.lead[i],s.wave,leadVol);
  const b=s.bass[i%s.bass.length];
  if(b)tone(freq(b)*.5,.20,'triangle',bassVol);
  if((key==='title'||key==='s1'||key==='s3'||key==='s5')&&i%4===0)
    tone(82,.035,'square',.007*BGM_MASTER);
  if((key==='s1'||key==='s5')&&i%8===4)
    tone(164,.025,'square',.004*BGM_MASTER);
  musicStep++
 };
 tick();
 musicTimer=setInterval(tick,s.ms)
}

function comboImpact(streak=2){
 initAudio();
 if(!ac)return;
 try{if(ac.state==='suspended')ac.resume()}catch(e){}
 const oct=Math.pow(2,Math.min(Math.max(streak-2,0),2));
 const t=ac.currentTime;

 // Bright 4-note arcade burst
 [660,880,1100,1320].forEach((f,i)=>{
   tone(f*oct,.135,'square',.22-i*.025,i*.045)
 });

 // Low punch underneath so it is clearly audible on phone speakers
 const o=ac.createOscillator(),g=ac.createGain();
 o.type='triangle';
 o.frequency.setValueAtTime(185*oct,t);
 o.frequency.exponentialRampToValueAtTime(72*oct,t+.14);
 g.gain.setValueAtTime(.0001,t);
 g.gain.exponentialRampToValueAtTime(.30,t+.004);
 g.gain.exponentialRampToValueAtTime(.0001,t+.17);
 o.connect(g);g.connect(ac.destination);
 o.start(t);o.stop(t+.18);

 // Short noisy "burst" layer
 try{
   const len=Math.floor(ac.sampleRate*.075);
   const buf=ac.createBuffer(1,len,ac.sampleRate);
   const data=buf.getChannelData(0);
   for(let i=0;i<len;i++){
     const env=Math.pow(1-i/len,1.7);
     data[i]=(Math.random()*2-1)*env;
   }
   const n=ac.createBufferSource(),bp=ac.createBiquadFilter(),ng=ac.createGain();
   n.buffer=buf;
   bp.type='bandpass';
   bp.frequency.setValueAtTime(1500,t);
   bp.Q.value=.7;
   ng.gain.setValueAtTime(.26,t);
   ng.gain.exponentialRampToValueAtTime(.0001,t+.075);
   n.connect(bp);bp.connect(ng);ng.connect(ac.destination);
   n.start(t);
 }catch(e){}

 // Extra high ping after the hit
 tone(1760*oct,.08,'square',.16,.16)
}


function sfx(k,streak=1){

 const oct=Math.pow(2,Math.min(Math.max(streak-1,0),2));
 if(k==='rot'){
  tone(700,.055,'square',.078);

  [520,650,780].forEach((f,i)=>tone(f*oct,.075,'square',.180-i*.016,i*.035))
 }
 if(k==='clearPop'){
  [330,440,660,880].forEach((f,i)=>tone(f*oct,.100,'square',.220-i*.020,i*.04))
 }
 if(k==='combo'){
  comboImpact(streak)
 }
 if(k==='cascade'){
  [520,440,350,290].forEach((f,i)=>tone(f,.075,'triangle',.13-i*.018,i*.038))
 }
 if(k==='cascadeLand'){
  tone(150,.11,'triangle',.24);
  tone(620,.055,'square',.12,.015)
 }
 if(k==='fanfare'){
  [523,659,784,1047,1319].forEach((f,i)=>tone(f,.20,'square',.095,i*.10))
 }
 if(k==='gameover'){
  [440,392,330,294,247,220].forEach((f,i)=>tone(f,.25,i<2?'square':'triangle',.095,i*.13))
 }

function findFullRows(){

function cascadeOneStep(){
 let moved=false;
 // bottom-up: each occupied cell can fall one row if unsupported.
 for(let y=ROWS-2;y>=0;y--){
  for(let x=0;x<COLS;x++){
   if(board[y][x]&&!board[y+1][x]){
    board[y+1][x]=board[y][x];
    board[y][x]=0;
    moved=true
   }
  }
 }

}

function runCascadeGravity(onSettled){

  const moved=cascadeOneStep();

  if(moved){
   movedAny=true;
   steps++;
   draw();

   // Audible/visible falling without turning every cell into a noisy hit.
   if(steps===1)sfx('cascade');
   if(steps%3===0)vibrate(7);

   setTimeout(step,68);
   return
  }

  lineFxActive=false;

  if(movedAny){
   sfx('cascadeLand');
   vibrate([14,8,20]);
   const bw=$('#boardWrap');
   bw.classList.remove('landThud');
   void bw.offsetWidth;
   bw.classList.add('landThud');
   setTimeout(()=>bw.classList.remove('landThud'),180)

  const chainRows=findFullRows();
  if(chainRows.length){
   // This is a true chain: no new player piece is spawned.
   setTimeout(()=>beginLineClear(chainRows),135);
   return
  }

  onSettled()
 };

 // Let the disappearing-row visual finish its last frame first.

}
